spring:
  ai:
    mcp:
      server:
        enabled: true
        protocol: STATELESS
        name: service-ai-mcp
        version: 1.0.0
        type: SYNC
        instructions: "查询城市天气, 工单查询，工单创建。"
        resource-change-notification: true
        tool-change-notification: true
        prompt-change-notification: true
        annotation-scanner:
          enabled: true
        streamable-http:
          mcp-endpoint: /mcp
          keep-alive-interval: 20s