spring:
  ai:
    session:
      # 会话默认过期时间，生产按需调整（默认 60d）
      time-to-live: 7d

      # 生产环境不要让模型自行决定系统消息，保持 false 由代码控制
      allow-system-messages: false

      repository:
        jdbc:
          # 生产环境不建议使用 always，应通过数据库迁移工具统一管理
          # 仅开发/测试环境设为 always
          initialize-schema: always

          # 若需要按 metadata 查询（如 parentSessionId），在此声明需要索引的键
          indexed-attributes:
            - parentSessionId

    chat:
      memory:
        repository:
          jdbc:
            platform: mysql
            initialize-schema: always
          redis:
            host: ${env.redis.host}
            port: ${env.redis.port}
            database: ${env.redis.database}
            username: ${env.redis.username}
            password: ${env.redis.password}
#            initialize-schema: false
            time-to-live: 10m
      client:
        observations:
          # 记录 ChatClient 层的提示内容（完整的对话消息列表）
          log-prompt: true
          # 记录模型返回的完成内容
          log-completion: true
#        tool-calling:
           # 设置为 false 可对所有调用禁用 ToolCallingAdvisor 自动注册。工具仍会下发给模型，但不会自动执行工具调用。
#          enabled: false
            # 自动注册的 ToolCallingAdvisor 在链中的位置。
#          advisor-order: 0
    ollama:
      base-url: http://192.168.3.174:11434  # 本地部署的模型
      chat:
        model: deepseek-r1:7b
    openai:
      api-key: ${DS_API_KEY}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-flash
    deepseek:
      api-key: ${DS_API_KEY}
      chat:
        model: deepseek-flash
