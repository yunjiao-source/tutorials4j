spring:
  cloud:
    gateway:
      metrics:
        enabled: true
      server:
        webflux:
          routes:
            - id: microservice-demo-route
              uri: lb://microservice-demo
              predicates:
                - Path=/api/demo/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Gateway-Source, api-gateway

            - id: microservice-gateway-route
              uri: lb://microservice-gateway
              predicates:
                - Path=/api/gateway/**
              filters:
                - StripPrefix=2

            - id: microservice-oauth-route
              uri: lb://microservice-oauth
              predicates:
                - Path=/api/oauth/**
              filters:
                - StripPrefix=2


# sa-token配置
sa-token:
  # 是否打印操作日志
  is-log: true

tutorials4j:
  toolkit:
    security:
      sa-token:
        filter:
          auth-strategies:
            - logging
            - blockUrls
            - whiteUrls
            - checkLogin
          before-auth-strategies:
            - cors
            - optionsMethod

          include-urls: /**

          exclude-urls:
            - /api/oauth/openapi/**

          white-urls:
            - /xxxx/**

          block-urls:
            - /xxxx/**

management:
  endpoint:
    gateway:
      access: read-only


