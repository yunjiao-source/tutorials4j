spring:
  cloud:
    gateway:
      metrics:
        enabled: true
      server:
        webflux:
          routes:
            - id: service-test-route
              uri: lb://service-test
              predicates:
                - Path=/api/test/**
              filters:
                - StripPrefix=2
                - AddRequestHeader=X-Gateway-Source, service-gateway

            - id: service-gateway-route
              uri: lb://service-gateway
              predicates:
                - Path=/api/gateway/**
              filters:
                - StripPrefix=2

            - id: service-uaa-route
              uri: lb://service-uaa
              predicates:
                - Path=/api/uaa/**
              filters:
                - StripPrefix=2

            - id: service-system-route
              uri: lb://service-system
              predicates:
                - Path=/api/system/**
              filters:
                - StripPrefix=2

tutorials4j:
  toolkit:
    security:
      sa-token:
        filter:
          auth-strategies:
            - logging
            - blockUrls
            - whiteUrls
            - checkLogin
          before-auth-strategies:
            - cors
            - optionsMethod

          include-urls: /**

          exclude-urls:
            - /api/uaa/openapi/**

          white-urls:
            - /xxxx/**

          block-urls:
            - /xxxx/**

management:
  endpoint:
    gateway:
      access: read-only


