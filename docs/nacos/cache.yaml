tutorials4j:
  toolkit:
    cache:
      type: redis
      caffeine:
        caches:
          clients:
            expire-after-write: 10m
            maximum-size: 1000
            initial-capacity: 100
          users:
            expire-after-write: 30m
            maximum-size: 1000
            initial-capacity: 100
          login-fail-counter:
            expire-after-write: 10m
            maximum-size: 1000
            initial-capacity: 100
      redis:
        caches:
          clients:
            time-to-live: 10m
            caching-null-values: true
            key-prefix: 'cacheable:oauth:'
          users:
            time-to-live: 10m
            caching-null-values: true
            key-prefix: 'cacheable:oauth:'
          login-fail-counter:
            time-to-live: 10m
            caching-null-values: true
            key-prefix: 'cache:oauth:'