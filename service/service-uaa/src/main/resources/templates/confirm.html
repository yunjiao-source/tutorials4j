<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
		<meta name="robots" content="noindex, nofollow">
		<meta name="theme-color" content="#4f46e5">
		<title>确认授权 · 统一认证中心</title>
		<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='8'%20fill='%234f46e5'/%3E%3Cpath%20d='M16%207l6.5%202.6v5.3c0%203.7-2.6%207.1-6.5%208.1-3.9-1-6.5-4.4-6.5-8.1V9.6L16%207z'%20fill='white'/%3E%3C/svg%3E">
		<link rel="stylesheet" th:href="@{/css/auth.css}">
	</head>
	<body>

		<!-- 权限图标精灵 -->
		<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true"
				focusable="false" style="position:absolute">
			<symbol id="i-profile" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
				<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
				<circle cx="12" cy="7" r="4"/>
			</symbol>
			<symbol id="i-email" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
				<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/>
				<path d="m3 7.2 9 6 9-6"/>
			</symbol>
			<symbol id="i-address" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
				<path d="M20 10.5c0 5.5-8 11-8 11s-8-5.5-8-11a8 8 0 0 1 16 0Z"/>
				<circle cx="12" cy="10.3" r="2.8"/>
			</symbol>
			<symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
				<path d="M21.5 16.9v2.8a1.9 1.9 0 0 1-2.1 1.9 18.9 18.9 0 0 1-8.2-2.9 18.6 18.6 0 0 1-5.7-5.7A18.9 18.9 0 0 1 2.6 4.9 1.9 1.9 0 0 1 4.5 2.8h2.8a1.9 1.9 0 0 1 1.9 1.6c.1.9.4 1.8.7 2.7a1.9 1.9 0 0 1-.4 2l-1.2 1.2a15.2 15.2 0 0 0 5.7 5.7l1.2-1.2a1.9 1.9 0 0 1 2-.4c.9.3 1.8.6 2.7.7a1.9 1.9 0 0 1 1.6 1.9Z"/>
			</symbol>
			<symbol id="i-offline_access" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
				<path d="M3.5 12a8.5 8.5 0 0 1 14.4-6.1"/>
				<path d="M20.5 3.6v5.2h-5.2"/>
				<path d="M20.5 12a8.5 8.5 0 0 1-14.4 6.1"/>
				<path d="M3.5 20.4v-5.2h5.2"/>
			</symbol>
			<symbol id="i-scope" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
				<path d="M12 3 5 5.8v5.7c0 4.2 2.8 8 7 9 4.2-1 7-4.8 7-9V5.8L12 3Z"/>
				<path d="M12 8.4v3.2"/>
				<path d="M12 14.6h.01"/>
			</symbol>
		</svg>

		<main class="auth-card auth-card--wide">
			<header class="auth-brand">
				<span class="auth-brand__mark" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
							stroke-linecap="round" stroke-linejoin="round">
						<path d="M9.5 3.5h5a1.5 1.5 0 0 1 1.5 1.5v1h1.5A1.5 1.5 0 0 1 19 7.5v12A1.5 1.5 0 0 1 17.5 21h-11A1.5 1.5 0 0 1 5 19.5v-12A1.5 1.5 0 0 1 6.5 6H8V5a1.5 1.5 0 0 1 1.5-1.5Z"/>
						<path d="M9.5 12.5h5M9.5 16h3"/>
					</svg>
				</span>
				<div>
					<h1 class="auth-brand__title">确认授权</h1>
					<p class="auth-brand__subtitle">请确认是否允许该应用访问你的账号</p>
				</div>
			</header>

			<!-- 应用信息（由 DefaultSaOAuth2ConfirmViewFunction 注入 view） -->
			<div class="auth-context" th:if="${view != null}">
				<span class="auth-context__icon" aria-hidden="true">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
						<rect x="3" y="4" width="18" height="16" rx="3"/>
						<path d="M8 10h8M8 14h5"/>
					</svg>
				</span>
				<span>
					<span class="auth-context__name"
							th:if="${!#strings.isEmpty(view.clientName)}"
							th:text="${view.clientName}">应用名称</span>
					<span class="auth-context__name"
							th:unless="${!#strings.isEmpty(view.clientName)}"
							th:text="${view.clientId}">应用</span>
					申请获取以下权限
					<span class="auth-context__id" th:text="|应用 ID：${view.clientId}|"></span>
				</span>
			</div>

			<!-- 授权成功后将被送往的地址，便于用户确认目标应用 -->
			<div class="auth-target" id="redirectTargetBox" hidden>
				<svg class="auth-target__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
						stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
					<path d="M10 13.5a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1.2 1.2"/>
					<path d="M14 10.5a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1.2-1.2"/>
				</svg>
				<span class="auth-target__label">授权后返回</span>
				<span class="auth-target__value" id="redirectTargetValue"></span>
			</div>

			<div class="auth-alert" id="confirmAlert" data-type="error" role="alert" aria-live="polite">
				<svg class="auth-alert__icon auth-alert__icon--error" viewBox="0 0 24 24" fill="none"
						stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
						aria-hidden="true">
					<circle cx="12" cy="12" r="9"/>
					<path d="M12 7.6v5.2M12 16.3h.01"/>
				</svg>
				<svg class="auth-alert__icon auth-alert__icon--success" viewBox="0 0 24 24" fill="none"
						stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
						aria-hidden="true">
					<circle cx="12" cy="12" r="9"/>
					<path d="m8.4 12.3 2.4 2.4 4.8-5"/>
				</svg>
				<span class="auth-alert__text"></span>
			</div>

			<form class="auth-form" id="confirmForm" method="post" th:action="@{/accounts/doConfirm}" novalidate>
				<!--
					注意：scopeNames 是 Map，必须用 #maps 判断，不能用 #lists
					（#lists.isEmpty/#lists.size 会把整个 Map 当成单元素 List，永远判不出空）。
				-->
				<section class="auth-section"
						th:with="hasScopes=${view != null and view.scopeNames != null and !#maps.isEmpty(view.scopeNames)}">
					<div class="auth-section__head">
						<h2 class="auth-section__title">
							申请以下权限
							<span class="auth-section__count" id="scopeCounter"></span>
						</h2>
						<button class="auth-linkbtn" id="toggleAll" type="button" th:if="${hasScopes}">
							全部取消
						</button>
					</div>

					<div class="auth-empty" th:unless="${hasScopes}">
						该应用未申请任何权限
					</div>

					<!-- th:each 迭代 Map 时每一项是 java.util.Map.Entry，必须用 .key / .value 取值 -->
					<ul class="auth-scopes" th:if="${hasScopes}">
						<li class="auth-scope" th:each="scope : ${view.scopeNames}">
							<label class="auth-scope__label">
								<span class="auth-scope__icon" aria-hidden="true">
									<svg viewBox="0 0 24 24">
										<use th:href="'#i-' + ${scope.key}"></use>
									</svg>
								</span>
								<span class="auth-scope__text">
									<span class="auth-scope__name" th:text="${scope.value}">权限说明</span>
									<span class="auth-scope__tag" th:text="${scope.key}">scope</span>
								</span>
								<input class="auth-scope__input" type="checkbox" th:value="${scope.key}" checked>
								<span class="auth-scope__box" aria-hidden="true"></span>
							</label>
						</li>
					</ul>
				</section>

				<div class="auth-actions">
					<button class="auth-btn auth-btn--ghost" id="refuseBtn" type="button">拒绝</button>
					<button class="auth-btn auth-btn--primary" id="approveBtn" type="submit">同意授权</button>
				</div>
			</form>
		</main>

		<p class="auth-footnote">统一认证中心 · 请确认应用与权限范围均符合预期后再授权</p>

		<noscript>
			<p class="auth-noscript">当前浏览器已禁用 JavaScript，无法完成授权确认，请开启后重试。</p>
		</noscript>

		<script th:src="@{/js/auth.js}"></script>
		<script>
			(function () {
				"use strict";

				var form = document.getElementById("confirmForm");
				var alertBox = document.getElementById("confirmAlert");
				var approveBtn = document.getElementById("approveBtn");
				var refuseBtn = document.getElementById("refuseBtn");
				var toggleAllBtn = document.getElementById("toggleAll");
				var counter = document.getElementById("scopeCounter");
				var targetBox = document.getElementById("redirectTargetBox");
				var targetValue = document.getElementById("redirectTargetValue");
				var scopes = Array.prototype.slice.call(document.querySelectorAll(".auth-scope__input"));

				// 当前授权请求的全部参数（response_type / client_id / redirect_uri / scope / state ...）
				var params = window.Auth.query();
				var endpoint = form.getAttribute("action");

				var redirectUri = params.get("redirect_uri");
				if (redirectUri && targetBox && targetValue) {
					targetValue.textContent = redirectUri;
					targetValue.title = redirectUri;
					targetBox.hidden = false;
				}

				// 同步「已选数量」与「全选 / 全不选」按钮文案
				function syncScopeState() {
					var checked = scopes.filter(function (input) {
						return input.checked;
					});
					if (counter) {
						counter.textContent = "已选 " + checked.length + "/" + scopes.length + " 项";
					}
					if (toggleAllBtn) {
						toggleAllBtn.textContent = checked.length === scopes.length ? "全部取消" : "全部选择";
					}
					return checked;
				}

				// 用 URLSearchParams 拼装请求体，交由浏览器统一做百分号编码
				function buildBody(checked) {
					var body = new URLSearchParams(params);
					body.set("build_redirect_uri", "true");
					if (scopes.length > 0) {
						body.set("scope", checked.map(function (input) {
							return input.value;
						}).join(" "));
					}
					return body;
				}

				function setBusy(busy) {
					window.Auth.loading(approveBtn, busy, "授权中");
					refuseBtn.disabled = busy;
				}

				scopes.forEach(function (input) {
					input.addEventListener("change", syncScopeState);
				});
				syncScopeState();

				if (toggleAllBtn) {
					toggleAllBtn.addEventListener("click", function () {
						var allChecked = scopes.length > 0 && scopes.every(function (input) {
							return input.checked;
						});
						scopes.forEach(function (input) {
							input.checked = !allChecked;
						});
						syncScopeState();
						window.Auth.clearAlert(alertBox);
					});
				}

				// 同意授权：携带用户实际勾选的 scope
				form.addEventListener("submit", function (event) {
					event.preventDefault();
					window.Auth.clearAlert(alertBox);

					var checked = syncScopeState();
					if (scopes.length > 0 && checked.length === 0) {
						window.Auth.alert(alertBox, "warning", "请至少勾选一项权限；若不同意授权，请点击「拒绝」。");
						return;
					}

					setBusy(true);
					window.Auth.submit(endpoint, { method: "POST", body: buildBody(checked) })
							.then(function (body) {
								setBusy(false);
								window.Auth.alert(alertBox, "success", "授权成功，正在返回应用…");
								var target = body && body.redirect_uri;
								setTimeout(function () {
									if (target) {
										window.location.href = target;
									} else {
										// 服务端未返回回跳地址时，重新请求当前授权地址由服务端继续处理
										window.location.replace(window.location.href);
									}
								}, 700);
							})
							.catch(function (error) {
								setBusy(false);
								window.Auth.alert(alertBox, "error",
										error && error.message ? error.message : "授权失败，请稍后重试");
							});
				});

				// 拒绝授权：按 OAuth2 约定把结果回传给应用（保留 state）
				refuseBtn.addEventListener("click", function () {
					window.Auth.clearAlert(alertBox);

					var target = params.get("redirect_uri");
					if (!target) {
						window.Auth.alert(alertBox, "error", "当前授权请求缺少 redirect_uri，无法返回应用，请关闭页面后重试。");
						return;
					}

					window.location.href = window.Auth.appendParams(target, {
						handle: "refuse",
						msg: "用户拒绝了授权",
						state: params.get("state")
					});
				});
			})();
		</script>
	</body>
</html>
