
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      # 初始配置
      minimum-idle: 5
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

# 动态连接池配置
dynamic:
  pool:
    enabled: true

    # 扩容配置
    scale-up:
      enabled: true
      threshold-percentage: 80          # 使用率超过80%触发扩容
      queue-length-threshold: 5         # 等待队列超过5触发扩容
      increment-size: 10                # 每次增加10个连接
      max-pool-size: 100                # 最大连接数上限
      cooldown-time: 30s             # 扩容冷却时间（秒）

    # 缩容配置
    scale-down:
      enabled: true
      threshold-percentage: 30          # 使用率低于30%触发缩容
      min-pool-size: 5                  # 最小连接数下限
      decrement-size: 5                 # 每次减少5个连接
      idle-time: 1m         # 持续空闲1分钟才缩容

    # 监控配置
    monitor:
      enabled: true
      intervalTime: 10s             # 监控间隔
      metrics-retention-time: 60m     # 指标保留时间

    # 告警配置
    alert:
      enabled: true
      high-usage-threshold: 90          # 使用率超过90%告警
      queue-wait-threshold-time: 1000ms        # 等待时间超过1000ms告警
      channels: email,dingtalk

logging:
  level:
    tutorials4j: DEBUG
    com.zaxxer.hikari: INFO

