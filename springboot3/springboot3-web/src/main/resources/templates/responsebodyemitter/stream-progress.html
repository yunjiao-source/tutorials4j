<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>任务进度推送</title>
  <style>
    .progress-container {
      width: 100%;
      background-color: #e0e0e0;
      border-radius: 8px;
      margin: 20px 0;
    }
    .progress-bar {
      width: 0%;
      height: 30px;
      background-color: #4caf50;
      border-radius: 8px;
      text-align: center;
      line-height: 30px;
      color: white;
      transition: width 0.3s ease;
    }
    .info {
      font-family: monospace;
      margin-top: 10px;
    }
    button {
      padding: 6px 12px;
      cursor: pointer;
    }
    input {
      padding: 5px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
<h2>任务进度实时推送</h2>
<div>
  <label>任务ID：</label>
  <input type="text" id="taskId" value="task-001" />
  <button id="startBtn">开始监控</button>
  <button id="stopBtn" disabled>断开</button>
</div>
<div class="progress-container">
  <div class="progress-bar" id="progressBar">0%</div>
</div>
<div class="info" id="progressDesc"></div>

<script>
  let abortController = null;

  const taskIdInput = document.getElementById('taskId');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const progressBar = document.getElementById('progressBar');
  const progressDesc = document.getElementById('progressDesc');

  startBtn.addEventListener('click', async () => {
    if (abortController) {
      abortController.abort();
    }
    const taskId = taskIdInput.value.trim();
    if (!taskId) {
      alert('请输入任务ID');
      return;
    }

    abortController = new AbortController();
    startBtn.disabled = true;
    stopBtn.disabled = false;

    // 重置显示
    progressBar.style.width = '0%';
    progressBar.textContent = '0%';
    progressDesc.textContent = '';

    try {
      const response = await fetch(`/stream/progress/${taskId}`, {
        signal: abortController.signal
      });
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let lines = buffer.split('\n');
        buffer = lines.pop();
        for (let line of lines) {
          if (line.trim()) {
            processProgressMessage(line);
          }
        }
      }
    } catch (err) {
      if (err.name !== 'AbortError') {
        progressDesc.textContent = `错误: ${err.message}`;
      } else {
        progressDesc.textContent = '连接已终止';
      }
    } finally {
      startBtn.disabled = false;
      stopBtn.disabled = true;
      abortController = null;
    }
  });

  function processProgressMessage(msg) {
    // 消息格式: "进度: XX% - 描述" 或 "开始任务\n"
    if (msg.includes('进度:')) {
      const match = msg.match(/进度:\s*(\d+)%\s*-\s*(.*)/);
      if (match) {
        const percent = parseInt(match[1], 10);
        const desc = match[2];
        progressBar.style.width = percent + '%';
        progressBar.textContent = percent + '%';
        progressDesc.textContent = desc;
        if (percent === 100) {
          progressDesc.textContent = '✅ 任务完成！';
        }
      }
    } else {
      // 其他信息（如“开始任务\n”）
      progressDesc.textContent = msg.replace(/\n$/, '');
    }
  }

  stopBtn.addEventListener('click', () => {
    if (abortController) {
      abortController.abort();
    }
  });
</script>
</body>
</html>
