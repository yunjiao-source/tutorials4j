<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>AES加密登录</title>
  <!-- 引入 CryptoJS 库（CDN） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <!-- 可选样式：简单 Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .login-card { width: 400px; padding: 2rem; border-radius: 8px; box-shadow: 0 0 20px rgba(0,0,0,0.1); background: white; }
    .error-msg { color: red; margin-top: 10px; }
  </style>
</head>
<body>
<div class="login-card">
  <h3 class="text-center mb-3">AES加密登录</h3>
  <form id="loginForm">
    <div class="mb-3">
      <label for="username" class="form-label">用户名</label>
      <input type="text" class="form-control" id="username" name="username" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">密码</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">登录</button>
    <div id="message" class="error-msg text-center mt-3"></div>
  </form>
</div>

<script th:inline="javascript">

  // 从后端注入的 AES Base64 密钥
  const aesKeyBase64 = "MTIzNDU2Nzg5MDEyMzQ1Ng==";

  const CRYPTO_CONFIG = {
    mode: CryptoJS.mode.CBC,
    padding: CryptoJS.pad.Pkcs7
  }

  // 将 Base64 密钥转为 CryptoJS 的 WordArray，并提取前16字节作为 IV
  function getKeyAndIv() {
    // 解码BASE64密钥
    const keyBytes = CryptoJS.enc.Base64.parse(aesKeyBase64)
    // 取密钥前16字节作为IV向量（与后端一致）
    const iv = CryptoJS.lib.WordArray.create(keyBytes.words.slice(0, 4))
    return { key: keyBytes, iv: iv };
  }


  // AES 加密 (明文 -> Base64 密文)
  function encrypt(plainText) {
    const { key, iv } = getKeyAndIv();
    const encrypted = CryptoJS.AES.encrypt(
        plainText,
        key,
        { ...CRYPTO_CONFIG, iv }
    )

    return encrypted.toString();  // 返回Base64密文
  }

  // AES 解密 (Base64 密文 -> 明文)
  function decrypt(cipherText) {
    // 返回回多引号
    let cleaned = cipherText.replace(/^"|"$/g, '');
    const { key, iv } = getKeyAndIv();
    const decrypted = CryptoJS.AES.decrypt(
        cleaned,
        key,
        { ...CRYPTO_CONFIG, iv }
    )
    return decrypted.toString(CryptoJS.enc.Utf8);
  }

  // 登录表单提交
  document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const messageDiv = document.getElementById('message');
    messageDiv.innerText = '';

    // 构建 UserDto 对应的 JSON 对象（根据后端字段，假设 username / password）
    const loginData = { username: username, password: password };
    const jsonStr = JSON.stringify(loginData);

    // 加密请求体
    let encryptedBody;
    try {
      encryptedBody = encrypt(jsonStr);
    } catch (err) {
      messageDiv.innerText = '请求加密失败：' + err.message;
      return;
    }

    // 发送 Ajax 请求
    try {
      const response = await fetch('/api/auth/admin/login', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: encryptedBody
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }

      // 获取加密的响应体（密文）
      const cipherResponse = await response.text();
      // 解密响应
      let decryptedJson;
      try {
        decryptedJson = decrypt(cipherResponse);
      } catch (err) {
        messageDiv.innerText = '响应解密失败：' + err.message;
        return;
      }

      // 解析 Result 结构（假设后端返回 Result 格式：{ code:200, message:"...", data:"..." }）
      const result = JSON.parse(decryptedJson);
      if (result.code === 200) {
        messageDiv.style.color = 'green';
        messageDiv.innerText = '登录成功，Token: ' + (result.data || '');
        // 可自行存储 token 并跳转
        // localStorage.setItem('token', result.data);
        // window.location.href = '/home';
      } else {
        messageDiv.style.color = 'red';
        messageDiv.innerText = result.message || '登录失败';
      }
    } catch (error) {
      messageDiv.innerText = '请求异常：' + error.message;
    }
  });
  /*]]>*/
</script>
</body>
</html>
