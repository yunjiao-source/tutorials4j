spring:
  data:
    # Redis 配置
    redis:
      host: localhost # Redis服务器地址
      port: 6379 # Redis端口
      password: # Redis密码（无则留空）
      database: 0 # 数据库索引（默认0）
      timeout: 10000ms # 连接超时时间
      lettuce:
        pool:
          max-active: 8 # 最大连接数
          max-idle: 8 # 最大空闲连接数
          min-idle: 0 # 最小空闲连接数
          max-wait: -1ms # 连接池最大阻塞等待时间（-1表示无限制）
