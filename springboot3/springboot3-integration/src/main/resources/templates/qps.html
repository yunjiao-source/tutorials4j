<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QPS监控</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .chart-container { width: 600px; height: 400px; margin: 20px 0; }
    </style>
</head>
<body>
<h1>QPS监控面板</h1>

<h2>方法调用统计</h2>
<table>
    <thead>
    <tr>
        <th>方法名</th>
        <th>调用次数</th>
        <th>平均时间(ms)</th>
        <th>最短时间(ms)</th>
        <th>最长时间(ms)</th>
        <th>总时间(ms)</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="entry : ${stats}">
        <td th:text="${entry.key}">方法名</td>
        <td th:text="${entry.value.callCount}">0</td>
        <td th:text="${#numbers.formatDecimal(entry.value.avgTime, 1, 2)}">0.00</td>
        <td th:text="${entry.value.minTime}">0</td>
        <td th:text="${entry.value.maxTime}">0</td>
        <td th:text="${entry.value.totalTime}">0</td>
    </tr>
    </tbody>
</table>

<div class="chart-container">
    <canvas id="callTimeChart"></canvas>
</div>

<script>
    // 从后端API获取详细数据并绘制图表
    fetch('/api/method-qps-stats')
        .then(response => response.json())
        .then(data => {
            const ctx = document.getElementById('callTimeChart').getContext('2d');
            const methods = Object.keys(data);
            const avgTimes = methods.map(method => data[method].avgTime);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: methods,
                    datasets: [{
                        label: '平均调用时间(ms)',
                        data: avgTimes,
                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                requestOptions: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: '时间(ms)'
                            }
                        },
                        x: {
                            title: {
                                display: true,
                                text: '方法名'
                            }
                        }
                    }
                }
            });
        });
</script>
</body>
</html>
