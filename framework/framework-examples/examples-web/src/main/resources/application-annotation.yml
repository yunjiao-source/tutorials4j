
tutorials4j:
  cache:
    named:
      defaults:
        timeToLive: 2m
        cacheNullValues: false
        enable-statistics: true
      caches:
        web-security-idempotent:
          timeToLive: 3s
          cacheNullValues: false
        web-security-access-limited:
          timeToLive: 5s
          cacheNullValues: true

  web:
    security:
      enabled: true

      idempotent:
        include-path-patterns: /annotation/**
      access-limited:
        include-path-patterns: /annotation/**
