spring:
  data:
    # Redis 配置
    redis:
      host: localhost # Redis服务器地址
      port: 6379 # Redis端口
      database: 2


tutorials4j:
  cache:
    named:
      defaults:
        timeToLive: 2m
        cacheNullValues: false
        enable-statistics: true
      caches:
        web-security-idempotent:
          timeToLive: 3s
          cacheNullValues: false
          redis:
            cache-prefix: 'token:'
        web-security-access-limited:
          timeToLive: 5s
          cacheNullValues: true
          redis:
            cache-prefix: 'token:'

  web:
    security:
      idempotent:
        include-path-patterns: /annotation/**
      access-limited:
        include-path-patterns: /annotation/**