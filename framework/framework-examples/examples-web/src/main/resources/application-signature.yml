spring:
  data:
    # Redis 配置
    redis:
      host: localhost # Redis服务器地址
      port: 6379 # Redis端口
      database: 2


tutorials4j:
  web:
    rest:
      cached-body:
        url-patterns: /signature/pay
    security:
      signature:
        nonce-redis-key-prefix: 'signature:nonce:'
        interceptor:
          include-path-patterns: /signature/pay
        keys:
          appkey1: appSecret1
          appkey2: appSecret2
