<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多租户用户管理系统(JPA+表隔离)</title>
  <!-- Bootstrap 5 CSS + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <style>
    body {
      background-color: #f8f9fc;
      padding-bottom: 2rem;
    }
    .card-header {
      background-color: #f1f3f5;
      font-weight: 600;
    }
    .tenant-badge {
      font-size: 0.9rem;
      background-color: #e9ecef;
      padding: 6px 12px;
      border-radius: 30px;
    }
    .detail-card {
      background-color: #fef9e6;
    }
    .action-btn {
      margin-right: 5px;
    }
    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
    .table-responsive {
      max-height: 400px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="container mt-4">
  <!-- 头部信息 + 租户选择 -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 pb-2 border-bottom">
    <h2 class="h3 mb-0 text-primary">
      <i class="bi bi-building"></i> 多租户用户管理系统(JPA+表隔离)
    </h2>
    <div class="d-flex gap-3 align-items-center mt-2 mt-sm-0">
      <div class="tenant-badge">
        <i class="bi bi-tag"></i> 当前租户：
        <strong id="currentTenantLabel">DEFAULT</strong>
      </div>
      <div class="d-flex align-items-center gap-2">
        <label class="fw-semibold">租户切换:</label>
        <select id="tenantSelect" class="form-select w-auto">
          <option value="DEFAULT">DEFAULT</option>
          <option value="demo1">demo1</option>
        </select>
        <button id="refreshBtn" class="btn btn-outline-secondary btn-sm" title="刷新当前租户数据">
          <i class="bi bi-arrow-repeat"></i> 刷新
        </button>
      </div>
    </div>
  </div>

  <div class="row g-4">
    <!-- 左侧：创建用户卡片 -->
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header bg-white">
          <i class="bi bi-person-plus-fill text-success"></i> 创建新用户
        </div>
        <div class="card-body">
          <form id="createUserForm">
            <div class="mb-3">
              <label class="form-label">姓名 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="userName" name="name" placeholder="请输入姓名" required>
            </div>
            <div class="mb-3">
              <label class="form-label">电子邮箱 <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="userEmail" name="email" placeholder="user@example.com" required>
            </div>
            <button type="submit" class="btn btn-success w-100" id="createBtn">
              <i class="bi bi-check-lg"></i> 创建用户
            </button>
          </form>
          <div id="createMessage" class="mt-3 small"></div>
        </div>
      </div>

      <!-- 异步调用测试卡片 -->
      <div class="card shadow-sm mt-4">
        <div class="card-header bg-white">
          <i class="bi bi-hourglass-split text-warning"></i> 异步任务测试
        </div>
        <div class="card-body">
          <label class="form-label">用户ID</label>
          <div class="input-group">
            <input type="number" class="form-control" id="asyncUserId" placeholder="输入用户ID, 例如 1">
            <button class="btn btn-warning" id="triggerAsyncBtn" type="button">
              <i class="bi bi-play-circle"></i> 触发异步处理
            </button>
          </div>
          <div id="asyncMessage" class="mt-3 small text-muted"></div>
          <div class="alert alert-info mt-2 small">
            <i class="bi bi-info-circle"></i> 异步接口仅触发后端任务（延迟3秒&打印租户），立即返回，不影响前端。
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧：用户列表 + 详情区域 -->
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
          <span><i class="bi bi-table"></i> 用户列表</span>
          <span class="badge bg-secondary" id="userCount">0</span>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover align-middle" id="userTable">
              <thead class="table-light">
              <tr>
                <th>ID</th><th>姓名</th><th>邮箱</th><th style="width: 100px">操作</th>
              </tr>
              </thead>
              <tbody id="userTableBody">
              <tr><td colspan="4" class="text-center text-muted">加载中...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 用户详情卡片 -->
      <div class="card shadow-sm mt-4 detail-card">
        <div class="card-header bg-light">
          <i class="bi bi-info-circle-fill text-info"></i> 用户详情
        </div>
        <div class="card-body" id="detailContainer">
          <div class="text-muted fst-italic">点击任意用户右侧「详情」按钮，查看完整信息</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  $(function () {
    // ---------- 全局变量 ----------
    let currentTenant = "DEFAULT";   // 当前租户

    // ---------- 通用 Ajax 封装（自动携带 X-Tenant-Code 请求头）----------
    function ajaxRequest(method, url, data, successCallback, errorCallback) {
      const headers = {
        "X-Tenant-Code": currentTenant,
        "Content-Type": "application/json"
      };
      $.ajax({
        url: url,
        type: method,
        headers: headers,
        data: data ? JSON.stringify(data) : undefined,
        dataType: "json",
        success: function(response) {
          if (successCallback) successCallback(response);
        },
        error: function(xhr, status, error) {
          console.error("请求失败:", url, xhr.status, xhr.responseText);
          let errMsg = `请求失败 (${xhr.status})`;
          if (xhr.responseJSON && xhr.responseJSON.message) {
            errMsg = xhr.responseJSON.message;
          } else if (xhr.responseText) {
            errMsg = xhr.responseText.substring(0, 100);
          }
          if (errorCallback) {
            errorCallback(errMsg, xhr);
          } else {
            showToast(errMsg, "danger");
          }
        }
      });
    }

    // 简单的提示浮层 (Bootstrap Alert 临时显示)
    function showToast(message, type = "success") {
      const alertDiv = $("<div>")
      .addClass(`alert alert-${type} alert-dismissible fade show position-fixed top-0 start-50 translate-middle-x mt-3`)
      .css({"zIndex": 9999, "minWidth": "280px", "boxShadow": "0 0.5rem 1rem rgba(0,0,0,0.15)"})
      .html(`${message} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`);
      $("body").append(alertDiv);
      setTimeout(() => {
        alertDiv.alert("close");
      }, 3000);
    }

    // 更新租户显示
    function updateTenantDisplay() {
      $("#currentTenantLabel").text(currentTenant);
    }

    // 加载用户列表 (基于当前租户)
    function loadUserList() {
      $("#userTableBody").html(`<tr><td colspan="4" class="text-center text-secondary"><span class="spinner-border spinner-border-sm me-1"></span> 加载中...</td></tr>`);
      ajaxRequest("GET", "/users", null, function(users) {
        if (!users || !Array.isArray(users)) {
          users = [];
        }
        $("#userCount").text(users.length);
        if (users.length === 0) {
          $("#userTableBody").html(`<tr><td colspan="4" class="text-center text-muted">暂无用户数据，请创建</td></tr>`);
          return;
        }
        let html = "";
        $.each(users, function(idx, user) {
          html += `<tr>
                        <td>${user.id ?? '-'}</td>
                        <td>${escapeHtml(user.name ?? '')}</td>
                        <td>${escapeHtml(user.email ?? '')}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-primary detail-user-btn" data-id="${user.id}">
                                <i class="bi bi-eye"></i> 详情
                            </button>
                        </td>
                    </tr>`;
        });
        $("#userTableBody").html(html);
        // 绑定详情按钮事件
        $(".detail-user-btn").off("click").on("click", function() {
          const userId = $(this).data("id");
          showUserDetail(userId);
        });
      }, function(errMsg) {
        $("#userTableBody").html(`<tr><td colspan="4" class="text-danger text-center">加载失败: ${errMsg}</td></tr>`);
        $("#userCount").text("0");
      });
    }

    // 显示用户详情 (GET /users/{id})
    function showUserDetail(userId) {
      if (!userId) {
        showToast("无效的用户ID", "warning");
        return;
      }
      $("#detailContainer").html(`<div class="text-center"><div class="spinner-border text-info spinner-border-sm"></div> 加载详情...</div>`);
      ajaxRequest("GET", `/users/${userId}`, null, function(user) {
        if (!user || (!user.id && !user.name)) {
          $("#detailContainer").html(`<div class="alert alert-warning mb-0">未查询到用户 ID = ${userId}</div>`);
          return;
        }
        const detailHtml = `<div class="row g-2">
                    <div class="col-sm-4 fw-bold">ID：</div><div class="col-sm-8">${user.id}</div>
                    <div class="col-sm-4 fw-bold">姓名：</div><div class="col-sm-8">${escapeHtml(user.name)}</div>
                    <div class="col-sm-4 fw-bold">邮箱：</div><div class="col-sm-8">${escapeHtml(user.email)}</div>
                </div>`;
        $("#detailContainer").html(detailHtml);
      }, function(err) {
        $("#detailContainer").html(`<div class="alert alert-danger mb-0">获取详情失败: ${err}</div>`);
      });
    }

    // 创建用户
    function createUser(name, email) {
      if (!name.trim() || !email.trim()) {
        showToast("姓名和邮箱不能为空", "warning");
        return false;
      }
      const payload = { name: name.trim(), email: email.trim() };
      $("#createBtn").prop("disabled", true).html('<span class="spinner-border spinner-border-sm"></span> 提交中...');
      ajaxRequest("POST", "/users/create", payload, function(newUser) {
        showToast(`用户 ${newUser.name} 创建成功！`, "success");
        $("#createUserForm")[0].reset();
        loadUserList();      // 刷新列表
        // 若详情卡片之前显示内容, 可选择性清空
        $("#detailContainer").html(`<div class="text-muted fst-italic">用户已创建，点击列表详情查看</div>`);
      }, function(errMsg) {
        showToast(`创建失败: ${errMsg}`, "danger");
      }).always(function() {
        $("#createBtn").prop("disabled", false).html('<i class="bi bi-check-lg"></i> 创建用户');
      });
      return true;
    }

    // 异步请求测试
    function triggerAsync(userId) {
      if (!userId || userId <= 0) {
        showToast("请输入合法的用户ID (大于0)", "warning");
        return;
      }
      $("#triggerAsyncBtn").prop("disabled", true).html('<span class="spinner-border spinner-border-sm"></span> 提交中');
      ajaxRequest("GET", `/users/asyn/${userId}`, null, function() {
        showToast(`异步任务已触发 (用户ID=${userId})，后端将在后台处理，请观察控制台租户日志`, "success");
        $("#asyncMessage").html(`<i class="bi bi-check-circle-fill text-success"></i> 已触发异步任务 [租户: ${currentTenant}]`);
        setTimeout(() => {
          $("#asyncMessage").fadeOut(300, function() { $(this).empty().show(); });
        }, 5000);
      }, function(errMsg) {
        showToast(`异步请求失败: ${errMsg}`, "danger");
        $("#asyncMessage").html(`<i class="bi bi-x-circle-fill text-danger"></i> 请求失败: ${errMsg}`);
      }).always(function() {
        $("#triggerAsyncBtn").prop("disabled", false).html('<i class="bi bi-play-circle"></i> 触发异步处理');
      });
    }

    // 辅助防XSS
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>]/g, function(m) {
        if (m === '&') return '&amp;';
        if (m === '<') return '&lt;';
        if (m === '>') return '&gt;';
        return m;
      }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
        return c;
      });
    }

    // 租户切换逻辑
    function changeTenant(newTenant) {
      if (newTenant === currentTenant) return;
      currentTenant = newTenant;
      updateTenantDisplay();
      // 切换租户后自动刷新用户列表, 并且清空详情区域防止混淆
      $("#detailContainer").html(`<div class="text-muted fst-italic">已切换租户至 <strong>${currentTenant}</strong>，重新加载数据...</div>`);
      loadUserList();
      showToast(`租户已切换至 “${currentTenant}”`, "info");
    }

    // 事件绑定 ==========================
    $("#tenantSelect").change(function() {
      const selected = $(this).val();
      changeTenant(selected);
    });

    $("#refreshBtn").click(function() {
      loadUserList();
      showToast("已刷新用户列表", "secondary");
    });

    $("#createUserForm").submit(function(e) {
      e.preventDefault();
      const name = $("#userName").val();
      const email = $("#userEmail").val();
      createUser(name, email);
    });

    $("#triggerAsyncBtn").click(function() {
      const userId = $("#asyncUserId").val();
      if (userId === "" || isNaN(parseInt(userId))) {
        showToast("请输入有效的数字ID", "warning");
        return;
      }
      triggerAsync(parseInt(userId));
    });

    // 初始加载: 设置默认租户 DEFAULT (select已默认)
    currentTenant = "DEFAULT";
    updateTenantDisplay();
    $("#tenantSelect").val("DEFAULT");
    loadUserList();
  });
</script>

<!-- Bootstrap JS Bundle (用于关闭alert等) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
