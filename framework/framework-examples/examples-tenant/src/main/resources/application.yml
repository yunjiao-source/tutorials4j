spring:
  profiles:
#    active: mybatis-database
#    active: mybatis-table
    active: jpa-table
#    active: jpa-database
#    active: cache

  datasource:
    url: jdbc:postgresql://localhost:5432/demo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    #    hikari:
    #      minimum-idle: 5
    #      maximum-pool-size: 20
    #      connection-timeout: 30000
    #      idle-timeout: 600000
    #      max-lifetime: 1800000

    #    dbcp2:
    #      initial-size: 5
    #      max-total: 20
    #      min-idle: 5
    #      max-idle: 10

    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      # 监控配置
      filters: stat,wall,slf4j
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: 123456
        reset-enable: true
      web-stat-filter:
        enabled: true
        url-pattern: /*
        exclusions: '*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*'


  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  thymeleaf:
    cache: false

  data:
    # Redis 配置
    redis:
      host: localhost # Redis服务器地址
      port: 6379 # Redis端口
      database: 2


tutorials4j:
  tenant:
    path:
      include-path-patterns: /users/**,/cacheable/**

logging:
  level:
    tutorials4j: DEBUG
#    org.springframework: debug