spring:
  task:
    scheduling:
      pool:
        size: 3  # 设定线程池大小，根据你的任务并发需求调整
      thread-name-prefix: example-scheduler-  # 可选：自定义线程名前缀，便于日志追踪

tutorials4j:
  schedule:
    tasks:
      demo1:
        enabled: true
        cron: 0/6 * * * * ?
        class-simple-name: demo1AutoRenewalTaskRunner
        description: 测试任务1
        execution:
          initial-delay: 10s

      demo2:
        enabled: true
        cron: 0/7 * * * * ?
        class-simple-name: demo2FixedLeaseTaskRunner
        description: 测试任务1
        execution:
          initial-delay: 10s

