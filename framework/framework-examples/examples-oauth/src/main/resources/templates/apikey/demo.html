<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Key 限流测试</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <style>
    body { margin-top: 50px; background: #f8f9fa; }
    .card { box-shadow: 0 0 20px rgba(0,0,0,0.1); }
    .result-area { margin-top: 20px; }
  </style>
</head>
<body>
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">🔑 API Key 限流示例 (每分钟最多 5 次，每天最多 10 次)</h4>
        </div>
        <div class="card-body">
          <!-- API Key 输入（默认固定值） -->
          <div class="mb-3">
            <label for="apiKeyInput" class="form-label">API Key (X-Api-Key)</label>
            <input type="text" class="form-control" id="apiKeyInput"
                   value="my-secret-key" placeholder="请输入 API Key">
          </div>

          <!-- 操作按钮 -->
          <button id="callApiBtn" class="btn btn-success me-2">🚀 调用 /api-key</button>
          <button id="resetBtn" class="btn btn-outline-secondary">🔄 重置计数</button>

          <!-- 结果显示区 -->
          <div class="result-area mt-4">
            <div id="resultAlert" class="alert alert-info" role="alert">
              点击按钮发起请求，查看结果。
            </div>
            <div id="remainingInfo" class="text-muted">
              剩余调用次数：<span id="remainingCount">5</span>
            </div>
          </div>
        </div>
      </div>
      <div class="mt-3 text-center text-muted small">
        * 每个 API Key 最多允许 5 次成功调用，超限返回 429。
      </div>
    </div>
  </div>
</div>

<script>
  $(document).ready(function() {
    let remaining = 0;

    // 更新剩余次数的显示
    function updateRemaining(remaining) {
      $('#remainingCount').text(remaining);
    }

    // 显示结果
    function showResult(success, message, remaining) {
      const alert = $('#resultAlert');
      alert.removeClass('alert-info alert-success alert-danger');
      if (success) {
        alert.addClass('alert-success');
        alert.html('✅ ' + message);
      } else {
        alert.addClass('alert-danger');
        alert.html('❌ ' + message);
      }
      if (remaining !== undefined) {
        updateRemaining(remaining);
      }
    }

    // 调用 /api-key
    $('#callApiBtn').click(function() {
      const apiKey = $('#apiKeyInput').val().trim();
      if (!apiKey) {
        showResult(false, '请先输入 API Key！');
        return;
      }

      $.ajax({
        url: '/api-key',
        type: 'GET',
        headers: {
          'X-Api-Key': apiKey
        },
        success: function(data) {
          remaining = remaining + 1;
          showResult(true, data, remaining);
        },
        error: function(xhr) {
          let msg = '请求失败';
          if (xhr.responseJSON && xhr.responseJSON.message) {
            msg = xhr.responseJSON.message;
          } else if (xhr.status === 429) {
            msg = '请求次数超限 (最大 5 次)';
          } else if (xhr.status === 401) {
            msg = '无效的 API Key';
          } else if (xhr.status === 400) {
            msg = '缺少 X-Api-Key 头';
          }

          showResult(false, msg, remaining);
        }
      });
    });

    // 重置计数（需要携带正确的 Key）
    $('#resetBtn').click(function() {
      const apiKey = $('#apiKeyInput').val().trim();
      if (!apiKey) {
        showResult(false, '请先输入 API Key 才能重置！');
        return;
      }
      $.ajax({
        url: '/reset',
        type: 'GET',
        headers: { 'X-Api-Key': apiKey },
        success: function() {
          // 重置后剩余次数恢复为 5
          updateRemaining(5);
          showResult(true, '计数已重置，可继续调用。', 5);
        },
        error: function() {
          showResult(false, '重置失败，请检查 Key 是否正确。');
        }
      });
    });

    // 初始查询剩余次数（可选）
    // 可以调用一个接口获取当前剩余，但本示例没有提供，用户可自行扩展
  });
</script>

<!-- Bootstrap JS (optional) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
