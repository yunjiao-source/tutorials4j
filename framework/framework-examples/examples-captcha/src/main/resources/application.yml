spring:
  profiles:
#    active: simple
    active: interceptor
#    active: tianai
#    active: unified

  data:
    # Redis 配置
    redis:
      host: localhost # Redis服务器地址
      port: 6379 # Redis端口
      database: 2

tutorials4j:
  cache:
    named:
      defaults:
        timeToLive: 5m
        cacheNullValues: false
        enable-statistics: false
      caches:
        captcha-behavior:
          timeToLive: 2m
          cacheNullValues: false
        captcha-graphic:
          timeToLive: 1m
          cacheNullValues: false


logging:
  level:
    tutorials4j: TRACE
#    org.springframework: debug