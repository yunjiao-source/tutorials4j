<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link  rel="stylesheet" href="/tac/css/tac.css">
  <script src="http://libs.baidu.com/jquery/2.0.0/jquery.min.js"></script>
  <script src="/tac/js/tac.min.js"></script>

  <style>
    ul li {
      list-style: none;
    }
    * {
      margin: 0;
      padding: 0;
    }
    .top{
      overflow: auto;
    }
    .top li:hover{
      cursor: pointer;
    }
    .top li{
      float: left;
      height: 40px;
      width: 120px;
      margin-right: 5px;
      line-height: 40px;
      text-align: center;
      background-color: #409eff;
      color: #fff;
      font-size: 15px;
      box-sizing: border-box;
      border: 1px solid #409eff;
    }
    .captcha-iframe {
      width: 300px;
      height: 320px;
      border: none;
    }
    .after {
      color: #88949d;
    }
  </style>
</head>

<body>
<div>
  <ul class="top">
    <li onclick="openCaptcha('TIANAI_SLIDER')">滑块验证码</li>
    <li onclick="openCaptcha('TIANAI_ROTATE')">旋转验证码</li>
    <li onclick="openCaptcha('TIANAI_CONCAT')">滑动还原验证码</li>
    <li onclick="openCaptcha('TIANAI_WORD_IMAGE_CLICK')">点选验证码</li>
  </ul>
  <div id="captcha-box"></div>
</div>
<script>
  let globalTAC;
  const config = {
    // 生成接口
    requestCaptchaDataUrl: "/captcha/tianai/gen?type=TIANAI_SLIDER",
    // 验证接口
    validCaptchaUrl: "/captcha/tianai/check",
    // 验证码绑定的div块
    bindEl: "#captcha-box",
    // 验证成功回调函数
    validSuccess: (res, c, tac) => {
      // 销毁验证码服务
      tac.destroyWindow();
      // 调用登录方法
      this.login(res.data.id);
    }
  }
  const style =    {
    // 按钮样式
    btnUrl: "/tac/images/btn3.png",
    // 背景样式
    bgUrl: "/tac/images/btn3-bg.jpg",
    // logo地址
    logoUrl: "/tac/images/logo.png",
    // 滑动边框样式
    moveTrackMaskBgColor: "#f7b645",
    moveTrackMaskBorderColor: "#ef9c0d"
  }
  function login(token) {
    // 在执行登录时，将验证码token传过去进行二次校验
    //$.get("/check2?id=" + token,  (res) => {
      alert("登录成功")
    //})
  }
  $(function () {
    // 创建 TAC 启动验证码服务
    globalTAC = new TAC(config, style).init();
  })
  function openCaptcha(type) {
    if (globalTAC) {
      globalTAC.destroyWindow();
    }
    config.requestCaptchaDataUrl = "/captcha/tianai/gen?type="+type
    globalTAC = new TAC(config, style).init();
  }
</script>
</body>
</html>
