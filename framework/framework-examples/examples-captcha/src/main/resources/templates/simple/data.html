<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>验证码接口数据展示</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      background: #f0f4f9;
      min-height: 100vh;
      padding: 30px 0;
      font-family: 'Segoe UI', 'PingFang SC', Roboto, sans-serif;
    }
    .main-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }
    .page-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .page-header h1 {
      font-weight: 700;
      color: #1a2a3a;
      font-size: 2.2rem;
    }
    .page-header h1 i {
      color: #4a90d9;
      margin-right: 12px;
    }
    .page-header p {
      color: #6c7a8a;
      font-size: 1.05rem;
      margin-top: 6px;
    }
    /* 类型卡片 */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
      margin-bottom: 30px;
    }
    .category-card {
      background: #fff;
      border-radius: 14px;
      padding: 16px 10px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      border: 2.5px solid transparent;
      user-select: none;
    }
    .category-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 22px rgba(0,0,0,0.10);
      border-color: #d0dce8;
    }
    .category-card.active {
      border-color: #4a90d9;
      background: #f0f7ff;
      box-shadow: 0 4px 16px rgba(74,144,217,0.20);
    }
    .category-card .icon {
      font-size: 1.8rem;
      display: block;
      margin-bottom: 6px;
      color: #4a6a8a;
    }
    .category-card.active .icon {
      color: #4a90d9;
    }
    .category-card .name {
      font-size: 0.82rem;
      font-weight: 600;
      color: #1a2a3a;
      line-height: 1.3;
    }
    .category-card .badge-ext {
      font-size: 0.65rem;
      background: #e9edf2;
      color: #6c7a8a;
      padding: 2px 10px;
      border-radius: 30px;
      margin-top: 5px;
      display: inline-block;
    }
    .category-card.active .badge-ext {
      background: #4a90d9;
      color: #fff;
    }
    /* 展示面板 */
    .display-panel {
      background: #fff;
      border-radius: 20px;
      padding: 30px 28px;
      box-shadow: 0 6px 28px rgba(0,0,0,0.07);
      min-height: 360px;
    }
    .json-container {
      background: #1e2a36;
      border-radius: 14px;
      padding: 18px 22px;
      overflow: auto;
      max-height: 450px;
    }
    .json-container pre {
      margin: 0;
      color: #e6edf3;
      font-family: 'JetBrains Mono', 'Cascadia Code', 'Consolas', monospace;
      font-size: 0.9rem;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .json-container .json-key {
      color: #f97583;
    }
    .json-container .json-string {
      color: #9cdcfe;
    }
    .json-container .json-number {
      color: #b5cea8;
    }
    .json-container .json-boolean {
      color: #569cd6;
    }
    .json-container .json-null {
      color: #ce9178;
    }
    .json-container .json-bracket {
      color: #d4d4d4;
    }
    .placeholder-text {
      color: #a0b0c0;
      font-size: 1rem;
      text-align: center;
      padding: 20px 0;
    }
    .loading-spinner {
      color: #4a90d9;
      font-size: 2.2rem;
      text-align: center;
      padding: 20px 0;
    }
    /* 信息栏 */
    .captcha-info {
      margin-top: 20px;
      width: 100%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 24px;
      padding: 12px 18px;
      background: #f7faff;
      border-radius: 12px;
      border: 1px solid #e8eef6;
    }
    .captcha-info .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: #2c3e50;
    }
    .captcha-info .info-item .label {
      color: #7a8a9a;
      font-weight: 500;
    }
    .captcha-info .info-item .value {
      font-weight: 600;
      color: #1a2a3a;
      background: #eef4fa;
      padding: 2px 14px;
      border-radius: 30px;
      font-size: 0.85rem;
    }
    .captcha-info .info-item .value.id-value {
      background: #e3eaf2;
      color: #2c5282;
    }
    /* 操作按钮 */
    .action-bar {
      margin-top: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }
    .btn-refresh {
      padding: 10px 36px;
      font-weight: 600;
      border-radius: 50px;
      background: #4a90d9;
      border: none;
      color: #fff;
      transition: all 0.2s ease;
    }
    .btn-refresh:hover {
      background: #3a7bc8;
      transform: scale(1.02);
      box-shadow: 0 4px 16px rgba(74,144,217,0.35);
    }
    .btn-refresh:active {
      transform: scale(0.97);
    }
    .btn-refresh i {
      margin-right: 8px;
    }
    .btn-outline-copy {
      padding: 10px 24px;
      font-weight: 500;
      border-radius: 50px;
      border: 1.5px solid #d0dce8;
      background: transparent;
      color: #4a6a8a;
      transition: all 0.2s ease;
    }
    .btn-outline-copy:hover {
      background: #f0f5fc;
      border-color: #4a90d9;
      color: #2c5282;
    }
    .alert-error {
      border-radius: 14px;
      background: #fff5f5;
      border: 1px solid #fed7d7;
      color: #c53030;
      padding: 14px 22px;
      margin-top: 16px;
      display: none;
    }
    .alert-error.show {
      display: block;
    }
    /* 响应式 */
    @media (max-width: 576px) {
      .page-header h1 { font-size: 1.6rem; }
      .category-grid { grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 10px; }
      .category-card { padding: 12px 6px; }
      .category-card .icon { font-size: 1.4rem; }
      .category-card .name { font-size: 0.72rem; }
      .display-panel { padding: 18px 14px; }
      .json-container { padding: 12px 14px; max-height: 300px; }
      .json-container pre { font-size: 0.75rem; }
      .captcha-info { flex-direction: column; gap: 6px; }
      .action-bar { flex-direction: column; align-items: center; }
      .btn-refresh, .btn-outline-copy { width: 100%; justify-content: center; }
    }
    /* 动画 */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .json-container {
      animation: fadeInUp 0.4s ease;
    }
  </style>
</head>
<body>

<div class="main-container">

  <div class="page-header">
    <h1><i class="fas fa-code"></i> 验证码接口数据</h1>
    <p>选择类型，查看后端返回的原始 JSON 结构</p>
  </div>

  <!-- 类型选择 -->
  <div class="category-grid" id="categoryGrid"></div>

  <!-- 展示面板 -->
  <div class="display-panel">

    <!-- JSON 展示区 -->
    <div class="json-container" id="jsonContainer">
      <div class="placeholder-text">
        <i class="fas fa-arrow-right" style="margin-right: 10px;"></i>
        请选择验证码类型
      </div>
    </div>

    <!-- 信息栏 -->
    <div class="captcha-info" id="infoBar">
      <div class="info-item">
        <span class="label"><i class="far fa-id-card"></i> ID</span>
        <span class="value id-value" id="captchaId">—</span>
      </div>
      <div class="info-item">
        <span class="label"><i class="far fa-file-image"></i> 格式</span>
        <span class="value" id="captchaExt">—</span>
      </div>
      <div class="info-item">
        <span class="label"><i class="far fa-clock"></i> 类型</span>
        <span class="value" id="captchaTypeDesc">—</span>
      </div>
    </div>

    <!-- 错误提示 -->
    <div class="alert-error" id="errorAlert">
      <i class="fas fa-exclamation-circle" style="margin-right: 10px;"></i>
      <span id="errorMessage">加载失败</span>
    </div>

    <!-- 操作按钮 -->
    <div class="action-bar">
      <button class="btn-refresh" id="btnRefresh">
        <i class="fas fa-sync-alt"></i> 刷新
      </button>
      <button class="btn-outline-copy" id="btnCopyId">
        <i class="far fa-copy"></i> 复制 ID
      </button>
      <button class="btn-outline-copy" id="btnCopyJson">
        <i class="far fa-copy"></i> 复制 JSON
      </button>
    </div>
  </div>

  <div class="text-center mt-4" style="color: #9aabbb; font-size: 0.85rem;">
    <i class="fas fa-plug"></i> 接口：<code>/captcha/create?category=xxx</code>
    &nbsp;·&nbsp; 支持 8 种验证码类型
  </div>
</div>

<!-- ============================================================ -->
<!-- 依赖 -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous">
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js">
</script>

<script>
  $(function() {

    // ============================================================
    // 类型配置（与后端 CaptchaCategory 对齐）
    // ============================================================
    const CATEGORIES = [
      { key: 'TIANAI_CONCAT',       label: '滑动还原', icon: 'fa-arrows-left-right', ext: 'png', desc: '滑动还原验证码' },
      { key: 'TIANAI_ROTATE',       label: '旋转',     icon: 'fa-rotate-right',      ext: 'png', desc: '旋转验证码' },
      { key: 'TIANAI_WORD_IMAGE_CLICK', label: '点选', icon: 'fa-hand-pointer',     ext: 'png', desc: '点选验证码' },
      { key: 'TIANAI_SLIDER',       label: '滑块',     icon: 'fa-arrows-up-down',    ext: 'png', desc: '滑块验证码' },
      { key: 'HUTOOL_LINE',         label: '线段干扰', icon: 'fa-grip-lines',        ext: 'png', desc: '线段干扰验证码' },
      { key: 'HUTOOL_CIRCLE',       label: '圆圈干扰', icon: 'fa-circle',            ext: 'png', desc: '圆圈干扰验证码' },
      { key: 'HUTOOL_SHEAR',        label: '扭曲干扰', icon: 'fa-wave-square',       ext: 'png', desc: '扭曲干扰验证码' },
      { key: 'HUTOOL_GIF',          label: 'GIF 动图', icon: 'fa-film',              ext: 'gif', desc: 'GIF验证码' }
    ];

    // ============================================================
    // 状态
    // ============================================================
    let currentCategory = CATEGORIES[0].key;
    let lastResponse = null;  // 缓存最新返回数据

    // ============================================================
    // DOM 引用
    // ============================================================
    const $grid = $('#categoryGrid');
    const $jsonContainer = $('#jsonContainer');
    const $captchaId = $('#captchaId');
    const $captchaExt = $('#captchaExt');
    const $captchaTypeDesc = $('#captchaTypeDesc');
    const $errorAlert = $('#errorAlert');
    const $errorMessage = $('#errorMessage');
    const $btnRefresh = $('#btnRefresh');
    const $btnCopyId = $('#btnCopyId');
    const $btnCopyJson = $('#btnCopyJson');

    // ============================================================
    // 渲染类型卡片
    // ============================================================
    function renderCategoryCards() {
      let html = '';
      CATEGORIES.forEach(cat => {
        const active = cat.key === currentCategory ? 'active' : '';
        html += `
                <div class="category-card ${active}" data-key="${cat.key}">
                    <span class="icon"><i class="fas ${cat.icon}"></i></span>
                    <div class="name">${cat.label}</div>
                    <span class="badge-ext">${cat.ext.toUpperCase()}</span>
                </div>
            `;
      });
      $grid.html(html);

      $grid.find('.category-card').on('click', function() {
        const key = $(this).data('key');
        if (key === currentCategory) {
          fetchCaptcha(key);
          return;
        }
        $grid.find('.category-card').removeClass('active');
        $(this).addClass('active');
        currentCategory = key;
        fetchCaptcha(key);
      });
    }

    // ============================================================
    // 调用接口
    // ============================================================
    function fetchCaptcha(categoryKey) {
      showLoading();
      $errorAlert.removeClass('show');

      $.ajax({
        url: '/captcha/create',
        type: 'GET',
        data: { category: categoryKey },
        dataType: 'json',
        timeout: 10000,
        success: function(resp) {
          lastResponse = resp;
          renderJson(resp);
          updateInfo(resp, categoryKey);
        },
        error: function(xhr, status, err) {
          let msg = '请求失败';
          if (xhr.responseJSON && xhr.responseJSON.message) msg = xhr.responseJSON.message;
          else if (status === 'timeout') msg = '请求超时，请检查网络';
          else if (xhr.status === 400) msg = '参数错误：请确认验证码类型是否正确';
          else if (xhr.status === 404) msg = '接口不存在，请检查后端服务';
          else if (xhr.status === 500) msg = '服务器内部错误，请查看后端日志';
          else msg = `加载失败 (${status || '未知错误'})`;
          showError(msg);
          $jsonContainer.html(`<div class="placeholder-text" style="color:#d45a5a;">
                    <i class="fas fa-exclamation-triangle"></i> ${msg}
                </div>`);
          $captchaId.text('—');
          $captchaExt.text('—');
          $captchaTypeDesc.text('—');
          lastResponse = null;
        }
      });
    }

    // ============================================================
    // 渲染 JSON（带简单语法高亮）
    // ============================================================
    function renderJson(data) {
      const jsonStr = JSON.stringify(data, null, 2);
      // 简单高亮：将字符串、数字、布尔值、null 等用颜色标记
      const highlighted = jsonStr.replace(
          /("(?:[^"\\]|\\.)*")(?=\s*:)?|(\b\d+\.?\d*\b)|(\btrue\b|\bfalse\b|\bnull\b)|([{}[\],])/g,
          function(match, p1, p2, p3, p4) {
            if (p1) return `<span class="json-string">${p1}</span>`;
            if (p2) return `<span class="json-number">${p2}</span>`;
            if (p3) return `<span class="json-boolean">${p3}</span>`;
            if (p4) return `<span class="json-bracket">${p4}</span>`;
            return match;
          }
      );
      // 进一步美化键名（冒号前的字符串）
      // 但上面的正则已经处理了键名作为字符串，但键名后跟冒号，我们希望键名显示为不同颜色（但这里简化，也可不处理）
      // 使用更稳健的方式：将键名（"key":）中的字符串高亮为键颜色
      const finalHtml = highlighted.replace(
          /<span class="json-string">("(?:[^"\\]|\\.)*")<\/span>(?=\s*:)/g,
          '<span class="json-key">$1</span>'
      );

      $jsonContainer.html(`<pre>${finalHtml}</pre>`);
    }

    // ============================================================
    // 更新信息栏
    // ============================================================
    function updateInfo(data, categoryKey) {
      const id = data.id || data.captchaId || data.token || data.uuid || data.key || '—';
      $captchaId.text(id);

      const catInfo = CATEGORIES.find(c => c.key === categoryKey);
      const ext = catInfo ? catInfo.ext.toUpperCase() : '—';
      $captchaExt.text(ext);

      const desc = catInfo ? catInfo.desc : categoryKey;
      $captchaTypeDesc.text(data.description || desc);
    }

    // ============================================================
    // UI 辅助
    // ============================================================
    function showLoading() {
      $jsonContainer.html(`
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-pulse"></i>
            </div>
            <div style="text-align:center;color:#8a9aaa;font-size:0.9rem;">加载中...</div>
        `);
    }

    function showError(msg) {
      $errorMessage.text(msg);
      $errorAlert.addClass('show');
    }

    // ============================================================
    // 按钮事件
    // ============================================================
    $btnRefresh.on('click', function() {
      fetchCaptcha(currentCategory);
    });

    // 复制 ID
    $btnCopyId.on('click', function() {
      const idText = $captchaId.text();
      if (idText && idText !== '—') {
        copyToClipboard(idText, '已复制 ID');
      } else {
        showTemporaryButtonText($btnCopyId, '无 ID', 1500);
      }
    });

    // 复制 JSON
    $btnCopyJson.on('click', function() {
      if (lastResponse) {
        const jsonStr = JSON.stringify(lastResponse, null, 2);
        copyToClipboard(jsonStr, '已复制 JSON');
      } else {
        showTemporaryButtonText($btnCopyJson, '无数据', 1500);
      }
    });

    // ============================================================
    // 工具函数
    // ============================================================
    function copyToClipboard(text, successMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          // 显示成功反馈（针对当前点击的按钮，这里通过传入的按钮对象，但无法直接获取，我们通过事件目标）
          // 由于在事件处理中，this 指向按钮，但这里被独立调用，我们使用调用者传递按钮引用
          // 我们可以获取当前点击的按钮，但为简化，直接使用一个全局反馈
          alert(successMsg || '已复制');
        }).catch(() => {
          fallbackCopy(text);
        });
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const $input = $('<input>');
      $input.val(text);
      $('body').append($input);
      $input.select();
      try {
        document.execCommand('copy');
        alert('已复制');
      } catch (e) {
        alert('复制失败，请手动复制');
      }
      $input.remove();
    }

    function showTemporaryButtonText($btn, text, duration) {
      const orig = $btn.html();
      $btn.html(text);
      setTimeout(() => $btn.html(orig), duration);
    }

    // ============================================================
    // 键盘快捷键 R
    // ============================================================
    $(document).on('keydown', function(e) {
      if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        $btnRefresh.click();
      }
    });

    // ============================================================
    // 初始化
    // ============================================================
    renderCategoryCards();
    fetchCaptcha(currentCategory);

    console.log('📦 验证码数据展示已启动，按 R 刷新');
  });
</script>

</body>
</html>
