<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>加密通信示例 - 安全表单提交</title>
  <!-- Bootstrap 5 CSS (稳定版) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery 3.7 精简版 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <!-- JSEncrypt RSA 加密库 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.3.2/jsencrypt.min.js"></script>
  <!-- 可选FontAwesome 图标库 (提升视觉体验) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
      min-height: 100vh;
      padding: 2rem 0;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }
    .crypto-card {
      border-radius: 1.25rem;
      border: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: all 0.2s ease;
      overflow: hidden;
    }
    .card-header {
      background: #2c3e66;
      color: white;
      font-weight: 600;
      padding: 1.2rem 1.8rem;
      border-bottom: none;
      font-size: 1.3rem;
    }
    .card-header i {
      margin-right: 10px;
    }
    .card-body {
      padding: 2rem;
    }
    .form-label {
      font-weight: 500;
      color: #1f2b48;
    }
    .btn-submit {
      background: #1e466e;
      border: none;
      padding: 0.7rem 1.8rem;
      font-weight: 600;
      transition: 0.2s;
      border-radius: 2rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .btn-submit:hover {
      background: #0f2e4a;
      transform: translateY(-2px);
    }
    .publicKey-status {
      background: #eef2f9;
      border-radius: 1rem;
      padding: 0.8rem 1.2rem;
      font-size: 0.85rem;
      border-left: 5px solid #2c7da0;
      margin-bottom: 1.8rem;
    }
    .result-area {
      background-color: #f8fafc;
      border-radius: 1rem;
      padding: 1.2rem;
      margin-top: 1.5rem;
      border: 1px solid #dee2e6;
      font-family: 'Courier New', monospace;
    }
    .toast-message {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 1100;
      min-width: 260px;
    }
    .badge-crypto {
      background-color: #355c7e;
      font-size: 0.75rem;
    }
    footer {
      text-align: center;
      margin-top: 2rem;
      color: #6c757d;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10">
      <div class="card crypto-card">
        <div class="card-header">
          <i class="fas fa-lock"></i> 安全加密通信 · RSA 非对称加密
        </div>
        <div class="card-body">
          <!-- 公钥状态区域 -->
          <div class="publicKey-status" id="publicKeyStatus">
            <i class="fas fa-key me-2"></i> <strong>公钥状态</strong> :
            <span id="keyStatusText" class="ms-2">🔄 正在从服务器获取公钥...</span>
            <br>
            <small class="text-muted" id="pubKeyPreview" style="word-break: break-all;"></small>
          </div>

          <!-- 表单: 实际需要加密传输的数据 -->
          <form id="secureForm">
            <div class="mb-3">
              <label for="username" class="form-label"><i class="far fa-user"></i> 用户名</label>
              <input type="text" class="form-control" id="username" placeholder="请输入用户名" required>
              <div class="form-text">此字段将被加密传输，后端自动解密处理</div>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label"><i class="far fa-envelope"></i> 邮箱</label>
              <input type="email" class="form-control" id="email" placeholder="your@example.com" required>
            </div>
            <div class="mb-4">
              <label for="message" class="form-label"><i class="far fa-comment-dots"></i> 备注信息</label>
              <textarea class="form-control" id="message" rows="3" placeholder="任何需要安全提交的信息..."></textarea>
            </div>
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
              <button type="submit" id="submitBtn" class="btn btn-submit text-white" disabled>
                <i class="fas fa-paper-plane"></i> 加密提交
              </button>
              <button type="button" id="refreshKeyBtn" class="btn btn-outline-secondary btn-sm">
                <i class="fas fa-sync-alt"></i> 重新获取公钥
              </button>
            </div>
          </form>

          <!-- 服务器响应展示区域 -->
          <div class="result-area" id="resultArea" style="display: none;">
            <div class="d-flex align-items-center mb-2">
              <i class="fas fa-exchange-alt me-2 text-info"></i>
              <strong>后端解密响应</strong>
              <span class="badge badge-crypto ms-2 rounded-pill">RSA解密+业务处理</span>
            </div>
            <div id="responseContent" class="small"></div>
          </div>
          <div class="alert alert-warning mt-3 mb-0 small" role="alert">
            <i class="fas fa-info-circle"></i> 说明：前端使用 RSA 公钥加密整个请求体 (JSON字符串)，后端通过 <code>@Crypto(request=true)</code> 自动解密，本示例演示完整加密通信闭环。
          </div>
        </div>
      </div>
      <footer>
        <i class="fas fa-shield-alt"></i> 基于 Thymeleaf + Bootstrap + jQuery + JSEncrypt | 后端提供公钥端点 /api/crypto/publicKey 并自动解密请求体
      </footer>
    </div>
  </div>
</div>

<!-- 固定提示小toast (非阻塞) -->
<div class="toast-message" id="dynamicToast" style="display: none;">
  <div class="toast align-items-center text-white bg-dark border-0 show" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastMsgBody">
        提示信息
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
    </div>
  </div>
</div>

<script th:inline="javascript">
  /*<![CDATA[*/
  // 获取上下文根 (保证在不同部署路径下API路径正确)
  var contextPath = /*[[@{/}]]*/ '';
  // 公钥获取端点
  const PUBLIC_KEY_URL = contextPath + 'api/crypto/publicKey';
  // 加密提交的目标接口 (后端需存在对应Controller, 且方法标注@Crypto(request=true))
  // 示例假设接口为: POST /api/secure/submit 接收text/plain密文，自动解密后返回JSON
  const SUBMIT_URL = contextPath + 'api/secure/submit';

  // 全局存储公钥PEM格式及状态
  let publicKeyPEM = null;
  let isKeyReady = false;

  // 辅助函数: 将十六进制字符串转换为Uint8Array
  function hexToBytes(hex) {
    let len = hex.length;
    if (len % 2 !== 0) throw new Error("无效的十六进制字符串长度");
    let bytes = new Uint8Array(len / 2);
    for (let i = 0; i < len; i += 2) {
      bytes[i / 2] = parseInt(hex.substr(i, 2), 16);
    }
    return bytes;
  }

  // 核心: 将后端返回的十六进制公钥(DER格式, SubjectPublicKeyInfo)转换为PEM格式
  // 注意: 后端通过 CryptoProcessor.getSecretKey().publicKeyHex() 返回X.509规范的十六进制串。
  // 前端需要构建完整PEM: "-----BEGIN PUBLIC KEY-----\n" + base64DER + "\n-----END PUBLIC KEY-----"
  function hexToPublicKeyPem(hexKey) {
    try {
      // 十六进制字符串转二进制数据
      const derBytes = hexToBytes(hexKey);
      // 二进制转Base64 (浏览器兼容处理)
      let binaryStr = '';
      for (let i = 0; i < derBytes.length; i++) {
        binaryStr += String.fromCharCode(derBytes[i]);
      }
      // 标准Base64编码
      const base64Der = btoa(binaryStr);
      // 格式化PEM: 每64字符换行
      const pemBody = base64Der.match(/.{1,64}/g).join('\n');
      const pem = "-----BEGIN PUBLIC KEY-----\n" + pemBody + "\n-----END PUBLIC KEY-----";
      return pem;
    } catch (err) {
      console.error("公钥转换PEM失败", err);
      throw new Error("公钥格式转换错误: " + err.message);
    }
  }

  // 显示短暂提示浮窗 (简易)
  function showMessage(message, isError = false) {
    const toastDiv = $('#dynamicToast');
    const msgBody = $('#toastMsgBody');
    msgBody.text(message);
    toastDiv.removeClass('bg-dark bg-danger').addClass(isError ? 'bg-danger' : 'bg-dark');
    toastDiv.fadeIn(200);
    setTimeout(() => {
      toastDiv.fadeOut(500);
    }, 3000);
  }

  // 更新公钥状态UI
  function updateKeyStatus(ready, preview = '', errorMsg = null) {
    const statusSpan = $('#keyStatusText');
    const previewSpan = $('#pubKeyPreview');
    if (errorMsg) {
      statusSpan.html('<i class="fas fa-times-circle text-danger"></i> 公钥加载失败');
      previewSpan.text(errorMsg);
      isKeyReady = false;
      $('#submitBtn').prop('disabled', true);
      return;
    }
    if (ready && publicKeyPEM) {
      statusSpan.html('<i class="fas fa-check-circle text-success"></i> 公钥已就绪，可加密提交');
      let shortPreview = preview.length > 80 ? preview.substring(0, 77) + '...' : preview;
      previewSpan.html(`<i class="fas fa-fingerprint"></i> 公钥指纹(PEM前缀): ${shortPreview}`);
      $('#submitBtn').prop('disabled', false);
      isKeyReady = true;
    } else {
      statusSpan.html('<i class="fas fa-spinner fa-pulse"></i> 加载公钥中...');
      previewSpan.text('');
      $('#submitBtn').prop('disabled', true);
      isKeyReady = false;
    }
  }

  // 从服务器获取公钥(hex格式) 并转为PEM存储
  async function fetchPublicKey() {
    updateKeyStatus(false);
    try {
      showMessage("正在获取服务器公钥...");
      const response = await fetch(PUBLIC_KEY_URL, {
        method: 'GET',
        headers: { 'Accept': 'text/plain' }
      });
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
      }
      const hexKey = await response.text();
      if (!hexKey || hexKey.trim().length === 0) {
        throw new Error("服务器返回公钥为空");
      }
      const cleanedHex = hexKey.trim();
      // 简单校验是否全十六进制 (允许出现字母和数字)
      if (!/^[0-9A-Fa-f]+$/.test(cleanedHex)) {
        throw new Error("公钥格式非十六进制，请检查后端接口");
      }
      // 转换PEM
      const pem = hexToPublicKeyPem(cleanedHex);
      publicKeyPEM = pem;
      // 预览前35字符
      const previewPart = pem.substring(0, 45) + '...';
      updateKeyStatus(true, previewPart);
      console.log("RSA 公钥PEM已加载:", pem.substring(0, 60) + "......");
      showMessage("✓ 公钥加载成功，可进行加密提交", false);
      return true;
    } catch (err) {
      console.error("获取公钥失败:", err);
      updateKeyStatus(false, '', err.message);
      showMessage("公钥获取失败: " + err.message, true);
      return false;
    }
  }

  // 使用JSEncrypt加密文本
  function encryptWithPublicKey(plainText) {
    if (!publicKeyPEM) {
      throw new Error("公钥未加载，无法加密");
    }
    const crypt = new JSEncrypt();
    crypt.setPublicKey(publicKeyPEM);
    const encrypted = crypt.encrypt(plainText);
    if (!encrypted) {
      throw new Error("RSA加密失败，请检查公钥格式或明文字符串长度超出限制");
    }
    return encrypted;   // 返回Base64密文
  }

  // 组装请求数据(表单->json) 并加密后提交
  async function submitEncryptedData(event) {
    event.preventDefault();
    if (!isKeyReady || !publicKeyPEM) {
      showMessage("公钥尚未准备好，请稍后或点击刷新公钥", true);
      return;
    }

    // 获取表单数据
    const username = $('#username').val().trim();
    const email = $('#email').val().trim();
    const message = $('#message').val().trim();
    if (!username || !email) {
      showMessage("请填写用户名和邮箱", true);
      return;
    }
    // 构建业务数据对象 (后端Controller期望的DTO结构或者直接Map)
    const requestData = {
      username: username,
      email: email,
      message: message,
      timestamp: new Date().toISOString()
    };
    // 转为json字符串 (加密传输的内容)
    const plainJson = JSON.stringify(requestData);

    // 简单校验长度: RSA 2048位最多245字节, 一般JSON不会太大, 但做预警
    if (plainJson.length > 240) {
      showMessage("注意: 加密数据较长，RSA加密可能存在长度限制, 建议简化数据", false);
    }

    // 禁用提交按钮，显示loading
    const submitBtn = $('#submitBtn');
    const originalBtnHtml = submitBtn.html();
    submitBtn.html('<i class="fas fa-spinner fa-pulse"></i> 加密提交中...').prop('disabled', true);

    try {
      // 执行RSA加密
      const encryptedBase64 = encryptWithPublicKey(plainJson);
      console.log("加密后的密文(前50字符):", encryptedBase64.substring(0,50)+"......");

      // 发送加密请求体 (POST, Content-Type: text/plain)
      const submitResponse = await fetch(SUBMIT_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: encryptedBase64
      });

      if (!submitResponse.ok) {
        let errorText = `请求失败 ${submitResponse.status}`;
        try {
          const errorBody = await submitResponse.text();
          errorText += ` : ${errorBody.substring(0, 100)}`;
        } catch(e) {}
        throw new Error(errorText);
      }

      // 尝试解析后端返回的JSON (后端返回解密处理后的结果)
      const responseJson = await submitResponse.json();
      // 显示结果区域
      $('#resultArea').fadeIn(300);
      const prettyJson = JSON.stringify(responseJson, null, 2);
      $('#responseContent').html(`
                <div class="mb-1"><i class="fas fa-check-circle text-success"></i> 后端已成功解密请求并处理：</div>
                <pre class="small bg-white p-2 rounded border" style="max-height: 250px; overflow: auto;">${escapeHtml(prettyJson)}</pre>
            `);
      showMessage("提交成功！后端已解密并返回数据", false);
      // 可选: 清空表单或保持
      // $('#secureForm')[0].reset();  看需求注释
    } catch (err) {
      console.error("提交或加密异常", err);
      $('#resultArea').hide();
      showMessage("加密提交失败: " + err.message, true);
    } finally {
      // 恢复按钮状态, 若公钥仍有效则启用
      submitBtn.html(originalBtnHtml);
      if (isKeyReady && publicKeyPEM) {
        submitBtn.prop('disabled', false);
      } else {
        submitBtn.prop('disabled', true);
      }
    }
  }

  // 简单防XSS辅助
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
      return c;
    });
  }

  // 刷新公钥 (重置状态)
  async function refreshPublicKey() {
    publicKeyPEM = null;
    isKeyReady = false;
    await fetchPublicKey();
    // 如果之前有显示的结果区域, 最好保留但不清除; 但刷新公钥并不影响提交历史
    $('#submitBtn').prop('disabled', !isKeyReady);
  }

  // 初始化页面事件
  $(document).ready(async function() {
    // 加载公钥
    await fetchPublicKey();

    // 绑定表单提交事件
    $('#secureForm').on('submit', submitEncryptedData);

    // 刷新公钥按钮
    $('#refreshKeyBtn').on('click', function() {
      refreshPublicKey();
    });

    // 测试性提醒: 若后端没有实现 /api/secure/submit 接口，可提示配置
    console.log("提示: 确保后端存在 POST " + SUBMIT_URL + " 且方法使用 @Crypto(request=true) 以及 @RequestBody String 或 对象接收解密后的数据");
    // 友好警告（仅控制台）
  });

  // 可选: 增加Bootstrap Toast初始化 不使用额外依赖，使用简单模拟toast
  // 解决关闭按钮 (手动关闭简易toast)
  $(document).on('click', '.toast-message .btn-close', function() {
    $('#dynamicToast').fadeOut(300);
  });
  /*]]>*/
</script>

</body>
</html>
