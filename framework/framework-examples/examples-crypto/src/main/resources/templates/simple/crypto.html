<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>加密解密工具</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome 图标库 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js">
  </script>
  <style>
    body {
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 2rem 0;
    }

    .main-card {
      border: none;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      backdrop-filter: blur(10px);
      background: rgba(255, 255, 255, 0.92);
    }

    .card-header-custom {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1.8rem 2.5rem;
      border-bottom: none;
    }

    .card-header-custom h3 {
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
    }

    .card-header-custom i {
      margin-right: 12px;
    }

    .card-body-custom {
      padding: 2.5rem;
    }

    .form-label {
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 0.5rem;
    }

    .form-control,
    .form-select {
      border-radius: 12px;
      padding: 0.75rem 1.2rem;
      border: 2px solid #e2e8f0;
      transition: all 0.3s ease;
      font-size: 0.95rem;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.2);
    }

    .form-control::placeholder {
      color: #a0aec0;
    }

    .btn-group-custom {
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-crypto {
      border-radius: 50px;
      padding: 0.7rem 2.2rem;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.3s ease;
      border: none;
      min-width: 130px;
    }

    .btn-encrypt {
      background: linear-gradient(135deg, #00b894, #00a381);
      color: #fff;
    }
    .btn-encrypt:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
      color: #fff;
    }

    .btn-decrypt {
      background: linear-gradient(135deg, #fdcb6e, #f6b93b);
      color: #2d3436;
    }
    .btn-decrypt:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(253, 203, 110, 0.4);
      color: #2d3436;
    }

    .btn-clear {
      background: #edf2f7;
      color: #4a5568;
    }
    .btn-clear:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    .btn-crypto:disabled {
      opacity: 0.6;
      transform: none !important;
      cursor: not-allowed;
    }

    .result-box {
      background: #f8fafc;
      border-radius: 16px;
      padding: 1.5rem 1.8rem;
      border: 2px dashed #cbd5e0;
      min-height: 100px;
      transition: all 0.3s ease;
      position: relative;
    }

    .result-box.has-result {
      border-color: #667eea;
      border-style: solid;
      background: #f0f4ff;
    }

    .result-box .result-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #a0aec0;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .result-box .result-content {
      font-size: 1.05rem;
      word-break: break-all;
      color: #2d3748;
      font-family: 'Courier New', monospace;
    }

    .result-box .result-content.placeholder {
      color: #a0aec0;
      font-family: inherit;
      font-style: italic;
    }

    .copy-btn {
      position: absolute;
      top: 12px;
      right: 16px;
      background: rgba(102, 126, 234, 0.12);
      border: none;
      border-radius: 8px;
      padding: 4px 12px;
      font-size: 0.8rem;
      color: #667eea;
      cursor: pointer;
      transition: all 0.2s ease;
      display: none;
    }

    .copy-btn:hover {
      background: rgba(102, 126, 234, 0.25);
    }

    .result-box.has-result .copy-btn {
      display: block;
    }

    .spinner-overlay {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0.5rem 0;
    }

    .spinner-overlay.show {
      display: flex;
    }

    .spinner-overlay .spinner-text {
      color: #667eea;
      font-weight: 500;
    }

    .badge-category {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-weight: 500;
      padding: 0.4rem 1.2rem;
      border-radius: 50px;
      font-size: 0.85rem;
    }

    .footer-note {
      color: #a0aec0;
      font-size: 0.85rem;
      border-top: 1px solid #edf2f7;
      padding-top: 1.5rem;
      margin-top: 0.5rem;
    }

    /* 响应式调整 */
    @media (max-width: 576px) {
      .card-header-custom {
        padding: 1.2rem 1.5rem;
      }
      .card-header-custom h3 {
        font-size: 1.2rem;
      }
      .card-body-custom {
        padding: 1.5rem;
      }
      .btn-crypto {
        min-width: 100px;
        padding: 0.6rem 1.5rem;
        font-size: 0.9rem;
      }
      .btn-group-custom {
        gap: 8px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="row justify-content-center">
    <div class="col-lg-8 col-md-10 col-12">

      <!-- 主卡片 -->
      <div class="main-card card">

        <!-- 头部 -->
        <div class="card-header-custom text-white">
          <h3>
            <i class="fas fa-shield-halved"></i>
            加密 / 解密 工具
          </h3>
          <p class="mb-0 mt-1 opacity-75" style="font-size:0.9rem;">
            支持 AES · DES · SM2 · SM4 · RSA
          </p>
        </div>

        <!-- 主体 -->
        <div class="card-body-custom">

          <!-- 算法选择 -->
          <div class="mb-4">
            <label class="form-label" for="categorySelect">
              <i class="fas fa-cog me-1"></i> 加密算法
            </label>
            <select class="form-select" id="categorySelect">
              <option value="AES">AES</option>
              <option value="DES">DES</option>
              <option value="SM2">SM2</option>
              <option value="SM4">SM4</option>
              <option value="RSA">RSA</option>
            </select>
            <div class="mt-1">
              <span class="badge-category" id="selectedBadge">AES</span>
            </div>
          </div>

          <!-- 输入内容 -->
          <div class="mb-4">
            <label class="form-label" for="contentInput">
              <i class="fas fa-pen me-1"></i> 待处理内容
            </label>
            <textarea class="form-control" id="contentInput" rows="4"
                      placeholder="请输入要加密或解密的文本…"></textarea>
          </div>

          <!-- 操作按钮 -->
          <div class="d-flex flex-wrap align-items-center gap-3 mb-4 btn-group-custom">
            <button class="btn btn-crypto btn-encrypt" id="encryptBtn">
              <i class="fas fa-lock me-2"></i> 加密
            </button>
            <button class="btn btn-crypto btn-decrypt" id="decryptBtn">
              <i class="fas fa-unlock me-2"></i> 解密
            </button>
            <button class="btn btn-crypto btn-clear" id="clearBtn">
              <i class="fas fa-eraser me-2"></i> 清空
            </button>
            <span class="ms-auto text-muted small" id="statusMsg">
                                <i class="fas fa-circle-info me-1"></i> 就绪
                            </span>
          </div>

          <!-- 加载指示 -->
          <div class="spinner-overlay" id="spinnerOverlay">
            <div class="spinner-border spinner-border-sm text-primary" role="status"></div>
            <span class="spinner-text">处理中…</span>
          </div>

          <!-- 结果展示 -->
          <div class="result-box" id="resultBox">
            <div class="result-label">
              <i class="fas fa-arrow-right me-1"></i> 结果
            </div>
            <div class="result-content placeholder" id="resultContent">
              等待操作…
            </div>
            <button class="copy-btn" id="copyBtn">
              <i class="fas fa-copy me-1"></i> 复制
            </button>
          </div>

          <!-- 页脚 -->
          <div class="footer-note text-center">
            <i class="fas fa-code me-1"></i>
            后端接口 · 加密 / 解密
            <span class="mx-2">|</span>
            <span id="apiHint" class="text-muted" style="font-size:0.8rem;">
                                GET /crypto/encrypt?category=&amp;content=
                            </span>
          </div>

        </div><!-- /card-body -->
      </div><!-- /card -->

    </div>
  </div>
</div>

<!-- Bootstrap 5 JS (可选，用于某些交互) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<script>
  $(function() {

    // ---------- DOM 引用 ----------
    const $category = $('#categorySelect');
    const $content = $('#contentInput');
    const $encryptBtn = $('#encryptBtn');
    const $decryptBtn = $('#decryptBtn');
    const $clearBtn = $('#clearBtn');
    const $resultBox = $('#resultBox');
    const $resultContent = $('#resultContent');
    const $copyBtn = $('#copyBtn');
    const $spinner = $('#spinnerOverlay');
    const $statusMsg = $('#statusMsg');
    const $selectedBadge = $('#selectedBadge');

    // ---------- 辅助函数 ----------
    function setStatus(text, isError) {
      $statusMsg.html(text);
      if (isError) {
        $statusMsg.css('color', '#e53e3e');
      } else {
        $statusMsg.css('color', '#718096');
      }
    }

    function setLoading(loading) {
      if (loading) {
        $spinner.addClass('show');
        $encryptBtn.prop('disabled', true);
        $decryptBtn.prop('disabled', true);
        setStatus('<i class="fas fa-spinner fa-spin me-1"></i> 处理中…');
      } else {
        $spinner.removeClass('show');
        $encryptBtn.prop('disabled', false);
        $decryptBtn.prop('disabled', false);
      }
    }

    function displayResult(text) {
      if (text && text.trim().length > 0) {
        $resultContent.text(text);
        $resultContent.removeClass('placeholder');
        $resultBox.addClass('has-result');
      } else {
        $resultContent.text('（空结果）');
        $resultContent.addClass('placeholder');
        $resultBox.removeClass('has-result');
      }
    }

    function clearAll() {
      $content.val('');
      displayResult('');
      $resultBox.removeClass('has-result');
      $resultContent.text('等待操作…').addClass('placeholder');
      setStatus('<i class="fas fa-circle-info me-1"></i> 已清空');
      $copyBtn.hide(); // 由 has-result 控制显示，但以防万一
    }

    // 更新算法标签
    function updateBadge() {
      const val = $category.val();
      $selectedBadge.text(val);
    }
    $category.on('change', updateBadge);
    updateBadge();

    // ---------- 核心请求 ----------
    function callApi(action) {
      // action: 'encrypt' 或 'decrypt'
      const category = $category.val();
      const content = $content.val().trim();

      // 校验
      if (!content) {
        setStatus('<i class="fas fa-exclamation-triangle me-1"></i> 请输入待处理内容', true);
        $resultContent.text('⚠️ 请输入内容').removeClass('placeholder');
        $resultBox.addClass('has-result');
        return;
      }

      // 准备请求
      const url = '/crypto/' + action;
      const params = {
        category: category,
        content: content
      };

      setLoading(true);
      setStatus('<i class="fas fa-hourglass-half me-1"></i> 正在' + (action === 'encrypt' ? '加密' : '解密') + '…');

      $.ajax({
        url: url,
        type: 'GET',
        data: params,
        dataType: 'text', // 后端直接返回字符串
        timeout: 30000,
        success: function(data) {
          setLoading(false);
          // 后端返回的就是结果字符串
          displayResult(data);
          const actionText = action === 'encrypt' ? '加密' : '解密';
          setStatus('<i class="fas fa-check-circle text-success me-1"></i> ' + actionText +
              '成功！');
          $resultBox.addClass('has-result');
        },
        error: function(xhr, status, error) {
          setLoading(false);
          let errMsg = '请求失败';
          if (xhr.responseText) {
            // 尝试提取错误信息
            try {
              const json = JSON.parse(xhr.responseText);
              if (json.message) errMsg = json.message;
              else if (json.error) errMsg = json.error;
            } catch (e) {
              errMsg = xhr.responseText.substring(0, 100);
            }
          } else {
            errMsg = status + ' — ' + error;
          }
          setStatus('<i class="fas fa-xmark-circle text-danger me-1"></i> ' + errMsg, true);
          $resultContent.text('❌ ' + errMsg).removeClass('placeholder');
          $resultBox.addClass('has-result');
          console.error('API Error:', xhr, status, error);
        }
      });
    }

    // ---------- 事件绑定 ----------
    $encryptBtn.on('click', function() {
      callApi('encrypt');
    });

    $decryptBtn.on('click', function() {
      callApi('decrypt');
    });

    $clearBtn.on('click', clearAll);

    // 回车快捷键：在 textarea 中 Ctrl+Enter 或 Command+Enter 触发加密
    $content.on('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        // 默认执行加密
        callApi('encrypt');
      }
    });

    // 复制结果
    $copyBtn.on('click', function() {
      const text = $resultContent.text();
      if (text && text !== '等待操作…' && text !== '（空结果）') {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() {
            setStatus('<i class="fas fa-check text-success me-1"></i> 已复制到剪贴板');
          }).catch(function() {
            // fallback
            fallbackCopy(text);
          });
        } else {
          fallbackCopy(text);
        }
      }
    });

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        setStatus('<i class="fas fa-check text-success me-1"></i> 已复制到剪贴板');
      } catch (e) {
        setStatus('<i class="fas fa-exclamation-triangle text-warning me-1"></i> 复制失败，请手动选择复制', true);
      }
      document.body.removeChild(ta);
    }

    // ---------- 页面初始化 ----------
    // 默认展示示例内容（方便测试）
    $content.val('Hello, 加密解密工具！');
    displayResult('');
    setStatus('<i class="fas fa-circle-info me-1"></i> 就绪，选择算法后点击加密或解密');

    // 点击结果区域可以复制（便捷）
    $resultBox.on('click', function(e) {
      // 如果点击的是复制按钮本身，不触发
      if ($(e.target).closest('.copy-btn').length) return;
      const text = $resultContent.text();
      if (text && text !== '等待操作…' && text !== '（空结果）' && !text.startsWith('⚠️') && !text.startsWith(
          '❌')) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(function() {
            setStatus('<i class="fas fa-check text-success me-1"></i> 已复制');
          }).catch(function() {});
        }
      }
    });

  });
</script>

</body>
</html>
