
tutorials4j:
  cache:
    redis:
      timeToLive: 30m
      cacheNullValues: true
      named-caches:
        users:
          timeToLive: 30s
          cacheNullValues: false
          keyPrefix: user
          useKeyPrefix: true
        orders:
          timeToLive: 60s
          cacheNullValues: true
          keyPrefix: order
          useKeyPrefix: false

logging:
  level:
    tutorials4j: DEBUG