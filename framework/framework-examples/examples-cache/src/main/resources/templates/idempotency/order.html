<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>订单幂等性演示</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Font Awesome 图标库 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <style>
    body {
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card-shadow {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      border: none;
      border-radius: 20px;
      overflow: hidden;
    }
    .card-header-custom {
      background: linear-gradient(135deg, #4e73df, #224abe);
      padding: 24px 32px;
      border-bottom: none;
    }
    .card-header-custom h4 {
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .card-header-custom h4 i {
      margin-right: 10px;
    }
    .card-body {
      padding: 32px;
      background: #ffffff;
    }
    .form-label {
      font-weight: 500;
      color: #2d3748;
    }
    .input-group-custom .form-control {
      border-radius: 12px 0 0 12px;
      border: 2px solid #e2e8f0;
      padding: 12px 18px;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    .input-group-custom .form-control:focus {
      border-color: #4e73df;
      box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.15);
    }
    .btn-submit {
      border-radius: 0 12px 12px 0;
      padding: 12px 28px;
      font-weight: 600;
      background: linear-gradient(135deg, #4e73df, #224abe);
      border: none;
      color: #fff;
      transition: all 0.25s;
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(78, 115, 223, 0.35);
      background: linear-gradient(135deg, #3a5fd9, #1a3a9e);
      color: #fff;
    }
    .btn-submit:disabled {
      opacity: 0.6;
      transform: none;
      box-shadow: none;
    }
    .response-card {
      border-radius: 16px;
      padding: 20px 24px;
      margin-top: 24px;
      border-left: 6px solid transparent;
      background: #f8f9fc;
      transition: all 0.3s;
      min-height: 80px;
      display: flex;
      align-items: center;
    }
    .response-card.success {
      border-left-color: #1cc88a;
      background: #f0fff4;
    }
    .response-card.error {
      border-left-color: #e74a3b;
      background: #fff5f5;
    }
    .response-card.idempotent {
      border-left-color: #f6c23e;
      background: #fffbeb;
    }
    .response-card .response-icon {
      font-size: 2rem;
      margin-right: 18px;
      flex-shrink: 0;
    }
    .response-card .response-content {
      flex: 1;
    }
    .response-card .response-content .response-title {
      font-weight: 600;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }
    .response-card .response-content .response-detail {
      color: #5a6a7e;
      font-size: 0.92rem;
      word-break: break-all;
    }
    .response-card .response-content .response-detail code {
      background: #edf2f7;
      padding: 2px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #2d3748;
    }
    .badge-idempotent {
      background: #f6c23e;
      color: #7c6a0e;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 0.8rem;
    }
    .badge-idempotent i {
      margin-right: 6px;
    }
    .info-bar {
      background: #f8f9fc;
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .info-bar .info-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #4a5a72;
      font-size: 0.9rem;
    }
    .info-bar .info-item i {
      color: #4e73df;
      width: 20px;
    }
    .history-list {
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }
    .history-list .list-group-item {
      border: none;
      border-radius: 10px !important;
      margin-bottom: 6px;
      padding: 10px 16px;
      background: #f8f9fc;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .history-list .list-group-item .history-time {
      color: #8a9bb5;
      font-size: 0.8rem;
    }
    .history-list .list-group-item .history-status {
      font-weight: 500;
    }
    .history-list .list-group-item .history-status.success {
      color: #1cc88a;
    }
    .history-list .list-group-item .history-status.error {
      color: #e74a3b;
    }
    .history-list .list-group-item .history-status.idempotent {
      color: #f6c23e;
    }
    .footer-note {
      margin-top: 18px;
      color: #9aa8b9;
      font-size: 0.8rem;
      text-align: center;
      border-top: 1px solid #edf2f7;
      padding-top: 16px;
    }
    .spinner-border-sm {
      width: 1.2rem;
      height: 1.2rem;
      border-width: 0.2em;
    }
    @media (max-width: 576px) {
      .card-body {
        padding: 20px;
      }
      .card-header-custom {
        padding: 18px 20px;
      }
      .btn-submit {
        padding: 10px 18px;
        font-size: 0.9rem;
      }
      .info-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>

<div class="container" style="max-width: 720px;">
  <div class="card card-shadow">
    <!-- 卡片头部 -->
    <div class="card-header-custom">
      <h4>
        <i class="fas fa-shield-alt"></i>
        订单幂等性演示
        <span class="badge bg-light text-dark ms-2" style="font-weight:400;font-size:0.7rem;">
                    <i class="fas fa-redo-alt me-1"></i> 30s 内重复拦截
                </span>
      </h4>
    </div>

    <div class="card-body">
      <!-- 信息提示条 -->
      <div class="info-bar">
                <span class="info-item">
                    <i class="fas fa-info-circle"></i>
                    接口: <code class="fw-bold">POST /order/{orderId}</code>
                </span>
        <span class="info-item">
                    <i class="fas fa-clock"></i>
                    幂等窗口: <span class="fw-bold" id="expireDisplay">30 秒</span>
                </span>
        <span class="info-item">
                    <i class="fas fa-key"></i>
                    Redis Key: <code id="sampleKey">idempotent:order:demo-001</code>
                </span>
      </div>

      <!-- 表单 -->
      <form id="orderForm" autocomplete="off">
        <div class="mb-4">
          <label for="orderIdInput" class="form-label">
            <i class="fas fa-hashtag me-1 text-primary"></i> 订单编号
          </label>
          <div class="input-group input-group-custom">
            <input type="text"
                   class="form-control"
                   id="orderIdInput"
                   placeholder="例如: ORD-20260826-001"
                   value="ORD-DEMO-001"
                   required/>
            <button class="btn btn-submit" type="submit" id="submitBtn">
              <i class="fas fa-paper-plane me-2"></i> 提交订单
            </button>
          </div>
          <div class="form-text mt-2">
            <i class="fas fa-lightbulb text-warning me-1"></i>
            同一个订单号在 <strong id="expireText">30</strong> 秒内重复提交将被幂等拦截。
          </div>
        </div>
      </form>

      <!-- 结果展示区 -->
      <div id="resultArea">
        <!-- 初始占位 -->
        <div class="response-card" id="resultPlaceholder" style="border-left-color:#d1d9e6;background:#fafcff;">
          <div class="response-icon" style="color:#b0c4de;">
            <i class="fas fa-inbox"></i>
          </div>
          <div class="response-content">
            <div class="response-title" style="color:#8a9bb5;">等待提交</div>
            <div class="response-detail">输入订单号后点击「提交订单」发起请求</div>
          </div>
        </div>
        <!-- 动态结果 (默认隐藏) -->
        <div id="resultDynamic" style="display:none;"></div>
      </div>

      <!-- 历史记录 -->
      <div class="mt-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
                    <span class="fw-semibold text-secondary" style="font-size:0.95rem;">
                        <i class="fas fa-history me-1"></i> 调用历史
                    </span>
          <button class="btn btn-sm btn-outline-secondary" id="clearHistoryBtn" style="border-radius:30px;">
            <i class="fas fa-eraser"></i> 清空
          </button>
        </div>
        <div class="history-list" id="historyList">
          <div class="text-center text-secondary py-2" style="font-size:0.9rem;" id="historyEmpty">
            <i class="fas fa-plus-circle me-1"></i> 暂无记录
          </div>
        </div>
      </div>

      <!-- 底部 -->
      <div class="footer-note">
        <i class="fas fa-database me-1"></i>
        基于 Redis 原子操作实现 · 幂等注解 <code>@IdempotentGuard</code>
      </div>
    </div>
  </div>
</div>

<!-- ============ jQuery & Bootstrap JS ============ -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous">
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>

<script>
  $(function() {

    // ---------- DOM 引用 ----------
    const $form = $('#orderForm');
    const $orderIdInput = $('#orderIdInput');
    const $submitBtn = $('#submitBtn');
    const $resultDynamic = $('#resultDynamic');
    const $resultPlaceholder = $('#resultPlaceholder');
    const $historyList = $('#historyList');
    const $historyEmpty = $('#historyEmpty');
    const $clearHistoryBtn = $('#clearHistoryBtn');
    const $expireDisplay = $('#expireDisplay');
    const $expireText = $('#expireText');
    const $sampleKey = $('#sampleKey');

    // 从后端注解读取的过期时间 (硬编码示例, 实际可从接口元数据获取, 这里直接写死匹配 OrderService 中的 30s)
    const EXPIRE_SECONDS = 30;
    $expireDisplay.text(EXPIRE_SECONDS + ' 秒');
    $expireText.text(EXPIRE_SECONDS);

    // ---------- 工具: 获取当前时间字符串 ----------
    function nowStr() {
      return new Date().toLocaleTimeString('zh-CN', { hour12: false });
    }

    // ---------- 渲染历史记录 ----------
    function renderHistory() {
      const records = getHistory();
      if (records.length === 0) {
        $historyList.html(`
                        <div class="text-center text-secondary py-2" style="font-size:0.9rem;" id="historyEmpty">
                            <i class="fas fa-plus-circle me-1"></i> 暂无记录
                        </div>
                    `);
        return;
      }
      let html = '';
      // 只显示最近 10 条
      const show = records.slice(-10).reverse();
      show.forEach(function(rec) {
        let statusClass = '';
        let statusText = '';
        let icon = '';
        if (rec.status === 'success') {
          statusClass = 'success';
          statusText = '成功';
          icon = '<i class="fas fa-check-circle text-success me-1"></i>';
        } else if (rec.status === 'idempotent') {
          statusClass = 'idempotent';
          statusText = '幂等拦截';
          icon = '<i class="fas fa-ban text-warning me-1"></i>';
        } else {
          statusClass = 'error';
          statusText = '失败';
          icon = '<i class="fas fa-times-circle text-danger me-1"></i>';
        }
        html += `
                        <div class="list-group-item">
                            <span>
                                <span class="history-status ${statusClass}">${icon} ${statusText}</span>
                                <span class="ms-2 text-secondary" style="font-size:0.85rem;">
                                    <code>${rec.orderId}</code>
                                </span>
                            </span>
                            <span class="history-time">${rec.time}</span>
                        </div>
                    `;
      });
      $historyList.html(html);
    }

    // ---------- 历史记录存储 (localStorage) ----------
    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem('idempotent_history') || '[]');
      } catch {
        return [];
      }
    }

    function pushHistory(orderId, status, message) {
      const records = getHistory();
      records.push({
        orderId: orderId,
        status: status, // 'success' | 'idempotent' | 'error'
        message: message || '',
        time: nowStr()
      });
      // 最多保留 50 条
      if (records.length > 50) records.splice(0, records.length - 50);
      localStorage.setItem('idempotent_history', JSON.stringify(records));
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem('idempotent_history');
      renderHistory();
    }

    // ---------- 显示结果 ----------
    function showResult(status, title, detail, iconClass, iconSymbol) {
      // 隐藏占位
      $resultPlaceholder.hide();
      // 构建结果卡片
      let statusClass = '';
      if (status === 'success') statusClass = 'success';
      else if (status === 'idempotent') statusClass = 'idempotent';
      else if (status === 'error') statusClass = 'error';
      else statusClass = '';

      const iconHtml = iconSymbol ? `<i class="${iconSymbol}"></i>` : `<i class="fas ${iconClass}"></i>`;

      $resultDynamic.html(`
                    <div class="response-card ${statusClass}">
                        <div class="response-icon">${iconHtml}</div>
                        <div class="response-content">
                            <div class="response-title">${title}</div>
                            <div class="response-detail">${detail}</div>
                        </div>
                    </div>
                `).show();
    }

    function resetResult() {
      $resultDynamic.hide();
      $resultPlaceholder.show();
    }

    // ---------- 提交订单 ----------
    function submitOrder(orderId) {
      // 禁用按钮，防止重复点击
      $submitBtn.prop('disabled', true);
      $submitBtn.html('<span class="spinner-border spinner-border-sm me-2" role="status"></span> 提交中...');

      // 清空之前的结果（保留占位）
      $resultDynamic.hide();
      $resultPlaceholder.show();

      // 发送 POST 请求
      $.ajax({
        url: '/order/' + encodeURIComponent(orderId),
        method: 'POST',
        timeout: 10000,
        success: function(data, textStatus, jqXHR) {
          // 成功 (HTTP 200)
          // 注意：后端正常返回 "订单处理成功"
          showResult(
              'success',
              '✅ 订单处理成功',
              `订单 <code>${orderId}</code> 已成功处理，响应内容：<span class="fw-semibold text-success">${data}</span>`,
              'fa-check-circle',
              'fas fa-check-circle text-success'
          );
          pushHistory(orderId, 'success', data);
        },
        error: function(jqXHR, textStatus, errorThrown) {
          let status = 'error';
          let title = '❌ 请求失败';
          let detail = '';
          let icon = 'fa-times-circle text-danger';

          // 尝试解析错误响应
          let respBody = null;
          let errorMsg = '';
          try {
            if (jqXHR.responseText) {
              respBody = JSON.parse(jqXHR.responseText);
              errorMsg = respBody.message || respBody.error || '';
            }
          } catch (e) { /* ignore */ }

          // 判断是否为幂等拦截 (状态码 409 或错误信息包含 idempotent 相关)
          const statusCode = jqXHR.status;
          const isIdempotent = (statusCode === 409)
              || (errorMsg && (errorMsg.toLowerCase().includes('idempotent')
                  || errorMsg.toLowerCase().includes('重复')
                  || errorMsg.toLowerCase().includes('already')));

          if (isIdempotent) {
            status = 'idempotent';
            title = '⛔ 幂等拦截';
            detail = `
                                订单 <code>${orderId}</code> 在 ${EXPIRE_SECONDS}s 内已处理过，<br/>
                                本次请求被幂等保护机制拦截。
                                ${errorMsg ? `<span class="text-secondary">（${errorMsg}）</span>` : ''}
                                <div class="mt-2">
                                    <span class="badge-idempotent">
                                        <i class="fas fa-shield-alt"></i> 重复请求已拒绝
                                    </span>
                                </div>
                            `;
            icon = 'fa-ban text-warning';
            pushHistory(orderId, 'idempotent', errorMsg || '幂等拦截');
          } else {
            // 其他错误
            let statusText = jqXHR.statusText || errorThrown || '未知错误';
            if (statusCode === 0) statusText = '网络请求失败，请检查服务是否可访问';
            title = '❌ 请求异常';
            detail = `
                                订单 <code>${orderId}</code> 处理失败。<br/>
                                <span class="text-danger">${statusText}</span>
                                ${errorMsg ? `<br/><span class="text-secondary">${errorMsg}</span>` : ''}
                                <div class="mt-2">
                                    <span class="badge bg-danger-subtle text-danger" style="font-weight:400;">
                                        HTTP ${statusCode || '--'}
                                    </span>
                                </div>
                            `;
            icon = 'fa-times-circle text-danger';
            pushHistory(orderId, 'error', errorMsg || statusText);
          }
          showResult(status, title, detail, icon, `fas ${icon}`);
        },
        complete: function() {
          // 恢复按钮
          $submitBtn.prop('disabled', false);
          $submitBtn.html('<i class="fas fa-paper-plane me-2"></i> 提交订单');
        }
      });
    }

    // ---------- 表单提交 ----------
    $form.on('submit', function(e) {
      e.preventDefault();
      const orderId = $orderIdInput.val().trim();
      if (!orderId) {
        // 简单校验
        $orderIdInput.addClass('is-invalid');
        setTimeout(function() { $orderIdInput.removeClass('is-invalid'); }, 2000);
        // 显示提示
        showResult(
            'error',
            '⚠️ 请输入订单编号',
            '订单编号不能为空，请填写后重试。',
            'fa-exclamation-triangle',
            'fas fa-exclamation-triangle text-warning'
        );
        return;
      }
      $orderIdInput.removeClass('is-invalid');

      // 更新示例 Key 显示
      $sampleKey.text('idempotent:order:' + orderId);

      // 执行提交
      submitOrder(orderId);
    });

    // ---------- 输入框变化时更新示例 Key ----------
    $orderIdInput.on('input', function() {
      const val = $(this).val().trim();
      if (val) {
        $sampleKey.text('idempotent:order:' + val);
      } else {
        $sampleKey.text('idempotent:order:{订单号}');
      }
    });

    // ---------- 清空历史 ----------
    $clearHistoryBtn.on('click', function() {
      if (confirm('确定要清空所有历史记录吗？')) {
        clearHistory();
      }
    });

    // ---------- 初始化 ----------
    // 从 localStorage 恢复历史
    renderHistory();
    // 初始化示例 Key
    const initVal = $orderIdInput.val().trim();
    if (initVal) {
      $sampleKey.text('idempotent:order:' + initVal);
    }

    // 回车提交（已由表单提交事件处理）
    console.log('✅ 订单幂等性演示页面已加载');
    console.log('📌 提示: 同一订单号在 ' + EXPIRE_SECONDS + 's 内重复提交会被拦截');
  });
</script>

</body>
</html>
