spring:
  profiles:
    active: cacheable


  data:
    # Redis 配置
    redis:
      host: localhost # Redis服务器地址
      port: 6379 # Redis端口

management:
  endpoints:
    web:
      exposure:
        include: metrics,caches
  endpoint:
    caches:
      enabled: true

logging:
  level:
    tutorials4j: DEBUG
#    org.springframework: debug