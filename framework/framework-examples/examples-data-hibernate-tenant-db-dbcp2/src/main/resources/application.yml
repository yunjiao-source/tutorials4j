spring:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    url: jdbc:postgresql://localhost:5432/demo
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    dbcp2:
      # 初始配置
      initial-size: 5
      max-total: 20
      min-idle: 5
      max-idle: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update


tutorials4j:
  data:
    tenant:
      path-patterns: /demo/*
      datasource:
        demo1:
          url: jdbc:postgresql://localhost:5432/demo1
          username: postgres
          password: postgres
          driver-class-name: org.postgresql.Driver

logging:
  level:
    tutorials4j: DEBUG