<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>任务调度管理</title>
  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-4">
  <h1>任务调度管理</h1>
  <div class="row mt-3">
    <div class="col-md-6">
      <button id="loadAllBtn" class="btn btn-primary">加载所有任务</button>
    </div>
    <div class="col-md-6">
      <div class="input-group">
        <input type="text" id="taskCodeInput" class="form-control" placeholder="输入任务代码">
        <div class="input-group-append">
          <button id="getDetailBtn" class="btn btn-info">详情</button>
          <button id="startBtn" class="btn btn-success">启动</button>
          <button id="cancelBtn" class="btn btn-warning">取消</button>
        </div>
      </div>
    </div>
  </div>
  <div id="resultArea" class="mt-3">
    <!-- 显示结果或表格 -->
  </div>
</div>

<script>
  $(document).ready(function() {
    // 加载所有任务
    $('#loadAllBtn').click(function() {
      $.get('/api/schedule/all', function(data) {
        displayTaskTable(data);
      }).fail(function() {
        alert('加载失败');
      });
    });

    // 获取详情
    $('#getDetailBtn').click(function() {
      var taskCode = $('#taskCodeInput').val().trim();
      if (!taskCode) { alert('请输入任务代码'); return; }
      $.get('/api/schedule/details', {taskCode: taskCode}, function(data) {
        displayTaskDetail(data);
      }).fail(function() {
        alert('获取详情失败');
      });
    });

    // 启动任务
    $('#startBtn').click(function() {
      var taskCode = $('#taskCodeInput').val().trim();
      if (!taskCode) { alert('请输入任务代码'); return; }
      $.get('/api/schedule/start', {taskCode: taskCode}, function(data) {
        displayTaskDetail(data);
      }).fail(function() {
        alert('启动失败');
      });
    });

    // 取消任务
    $('#cancelBtn').click(function() {
      var taskCode = $('#taskCodeInput').val().trim();
      if (!taskCode) { alert('请输入任务代码'); return; }
      $.get('/api/schedule/cancel', {taskCode: taskCode}, function(data) {
        displayTaskDetail(data);
      }).fail(function() {
        alert('取消失败');
      });
    });

    // 显示任务表格
    function displayTaskTable(tasks) {
      if (!tasks || tasks.length === 0) {
        $('#resultArea').html('<div class="alert alert-info">没有任务</div>');
        return;
      }
      var html = '<table class="table table-striped table-bordered">';
      html += '<thead><tr><th>任务代码</th><th>类名</th><th>Cron</th><th>启用</th><th>操作</th></tr></thead><tbody>';
      tasks.forEach(function(task) {
        html += '<tr>';
        html += '<td>' + task.taskCode + '</td>';
        html += '<td>' + task.classSimpleName + '</td>';
        html += '<td>' + task.cron + '</td>';
        html += '<td>' + (task.enabled ? '是' : '否') + '</td>';
        html += '<td>';
        html += '<button class="btn btn-sm btn-info detail-btn" data-taskcode="' + task.taskCode + '">详情</button> ';
        html += '<button class="btn btn-sm btn-success start-btn" data-taskcode="' + task.taskCode + '">启动</button> ';
        html += '<button class="btn btn-sm btn-warning cancel-btn" data-taskcode="' + task.taskCode + '">取消</button>';
        html += '</td></tr>';
      });
      html += '</tbody></table>';
      $('#resultArea').html(html);

      // 绑定表格中的按钮事件
      $('.detail-btn').click(function() {
        var code = $(this).data('taskcode');
        $('#taskCodeInput').val(code);
        $('#getDetailBtn').click();
      });
      $('.start-btn').click(function() {
        var code = $(this).data('taskcode');
        $('#taskCodeInput').val(code);
        $('#startBtn').click();
      });
      $('.cancel-btn').click(function() {
        var code = $(this).data('taskcode');
        $('#taskCodeInput').val(code);
        $('#cancelBtn').click();
      });
    }

    // 显示任务详情（或操作结果）
    function displayTaskDetail(data) {
      if (!data) {
        $('#resultArea').html('<div class="alert alert-warning">无数据</div>');
        return;
      }
      var html = '<div class="card"><div class="card-header">任务详情</div><div class="card-body">';
      html += '<dl class="row">';
      html += '<dt class="col-sm-3">任务代码</dt><dd class="col-sm-9">' + (data.taskCode || '') + '</dd>';
      html += '<dt class="col-sm-3">类名</dt><dd class="col-sm-9">' + (data.classSimpleName || '') + '</dd>';
      html += '<dt class="col-sm-3">Cron</dt><dd class="col-sm-9">' + (data.cron || '') + '</dd>';
      html += '<dt class="col-sm-3">启用</dt><dd class="col-sm-9">' + (data.enabled ? '是' : '否') + '</dd>';
      html += '<dt class="col-sm-3">描述</dt><dd class="col-sm-9">' + (data.description || '') + '</dd>';
      html += '<dt class="col-sm-3">元数据</dt><dd class="col-sm-9">' + (data.metadata ? JSON.stringify(data.metadata) : '') + '</dd>';
      html += '<dt class="col-sm-3">初始延迟</dt><dd class="col-sm-9">' + (data.initialDelay ? data.initialDelay : '') + '</dd>';
      html += '<dt class="col-sm-3">最大失败次数</dt><dd class="col-sm-9">' + (data.maxFailureCount !== undefined ? data.maxFailureCount : '') + '</dd>';
      html += '<dt class="col-sm-3">最大执行次数</dt><dd class="col-sm-9">' + (data.maxExecutionCount !== undefined ? data.maxExecutionCount : '') + '</dd>';
      html += '<dt class="col-sm-3">到期时间</dt><dd class="col-sm-9">' + (data.dueDate ? new Date(data.dueDate).toLocaleString() : '') + '</dd>';
      html += '<dt class="col-sm-3">批号</dt><dd class="col-sm-9">' + (data.lotNo || '') + '</dd>';
      html += '<dt class="col-sm-3">任务状态</dt><dd class="col-sm-9">' + (data.taskStatus || '') + '</dd>';
      html += '<dt class="col-sm-3">总计数</dt><dd class="col-sm-9">' + (data.totalCount !== undefined ? data.totalCount : '') + '</dd>';
      html += '<dt class="col-sm-3">总失败次数</dt><dd class="col-sm-9">' + (data.totalFailureCount !== undefined ? data.totalFailureCount : '') + '</dd>';
      html += '<dt class="col-sm-3">开始时间</dt><dd class="col-sm-9">' + (data.startTime ? new Date(data.startTime).toLocaleString() : '') + '</dd>';
      html += '<dt class="col-sm-3">结束时间</dt><dd class="col-sm-9">' + (data.endTime ? new Date(data.endTime).toLocaleString() : '') + '</dd>';
      html += '<dt class="col-sm-3">消息</dt><dd class="col-sm-9">' + (data.message || '') + '</dd>';
      html += '<dt class="col-sm-3">异常</dt><dd class="col-sm-9">' + (data.throwable ? data.throwable : '') + '</dd>';
      html += '</dl></div></div>';
      $('#resultArea').html(html);
    }
  });
</script>
</body>
</html>
