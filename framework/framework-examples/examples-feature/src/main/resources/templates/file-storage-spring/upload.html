<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文件上传示例 - FSS</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Font Awesome 6 (图标库) -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />

  <style>
    /* ===== 全局样式 ===== */
    body {
      background: #f5f7fb;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .page-header {
      background: linear-gradient(135deg, #0d6efd 0%, #0a58ca 100%);
      color: #fff;
      padding: 2rem 0 1.8rem;
      margin-bottom: 2rem;
      border-radius: 0 0 2rem 2rem;
      box-shadow: 0 8px 30px rgba(13, 110, 253, 0.25);
    }
    .page-header h1 {
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    .page-header p {
      opacity: 0.85;
      font-weight: 300;
      margin-bottom: 0;
    }

    .card-upload {
      border: none;
      border-radius: 1.25rem;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.06);
      transition: box-shadow 0.25s ease;
    }
    .card-upload:hover {
      box-shadow: 0 12px 50px rgba(0, 0, 0, 0.10);
    }

    /* 拖拽区域 */
    .drop-zone {
      border: 2px dashed #d0d7de;
      border-radius: 1rem;
      padding: 2.5rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: #fafbfc;
      position: relative;
    }
    .drop-zone:hover {
      border-color: #0d6efd;
      background: #f0f5ff;
    }
    .drop-zone.dragover {
      border-color: #0d6efd;
      background: #e8f0fe;
      transform: scale(1.01);
    }
    .drop-zone .icon {
      font-size: 3.5rem;
      color: #8b9eb0;
      margin-bottom: 0.75rem;
    }
    .drop-zone .text-muted {
      font-size: 0.95rem;
    }
    .drop-zone .file-name {
      font-weight: 500;
      color: #0d6efd;
      word-break: break-all;
    }
    .drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    /* 文件预览缩略图 */
    .file-preview {
      max-width: 120px;
      max-height: 120px;
      border-radius: 0.75rem;
      border: 1px solid #e9ecef;
      object-fit: cover;
      background: #fff;
      padding: 0.25rem;
    }
    .file-preview-placeholder {
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0.75rem;
      background: #f1f3f5;
      color: #8b9eb0;
      font-size: 2.5rem;
      border: 1px solid #e9ecef;
    }

    /* 进度条 */
    .progress-upload {
      height: 0.6rem;
      border-radius: 1rem;
      background: #e9ecef;
    }
    .progress-upload .progress-bar {
      background: linear-gradient(90deg, #0d6efd, #0a58ca);
      transition: width 0.15s ease;
    }

    /* 结果卡片 */
    .response-card {
      border-radius: 1rem;
      border: 1px solid #e9ecef;
      background: #fff;
      overflow: hidden;
    }
    .response-card .card-header {
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      font-weight: 600;
      padding: 0.75rem 1.25rem;
    }
    .response-card .card-body {
      padding: 0;
    }
    .response-table {
      margin-bottom: 0;
    }
    .response-table th {
      background: #f8f9fa;
      font-weight: 600;
      width: 180px;
      color: #495057;
      font-size: 0.875rem;
      padding: 0.65rem 1rem;
      border-bottom: 1px solid #e9ecef;
    }
    .response-table td {
      padding: 0.65rem 1rem;
      font-size: 0.9rem;
      border-bottom: 1px solid #e9ecef;
      word-break: break-all;
      vertical-align: middle;
    }
    .response-table tr:last-child th,
    .response-table tr:last-child td {
      border-bottom: none;
    }
    .response-table .label-group {
      color: #6c757d;
      font-weight: 400;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
    }

    /* 元数据展示 */
    .meta-tag {
      display: inline-block;
      background: #e9ecef;
      padding: 0.2rem 0.7rem;
      border-radius: 1rem;
      font-size: 0.8rem;
      color: #495057;
      margin: 0.15rem 0.25rem;
    }
    .meta-tag strong {
      font-weight: 600;
      color: #212529;
    }

    /* Toast 消息 */
    .toast-container {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
      .page-header {
        padding: 1.5rem 0 1.2rem;
        border-radius: 0 0 1.5rem 1.5rem;
      }
      .page-header h1 {
        font-size: 1.5rem;
      }
      .drop-zone {
        padding: 1.5rem 1rem;
      }
      .drop-zone .icon {
        font-size: 2.5rem;
      }
      .response-table th {
        width: 100px;
        font-size: 0.8rem;
        padding: 0.5rem 0.75rem;
      }
      .response-table td {
        font-size: 0.8rem;
        padding: 0.5rem 0.75rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== 顶部 Toast 容器 ===== -->
<div class="toast-container">
  <div id="liveToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body" id="toastMessage"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="关闭"></button>
    </div>
  </div>
</div>

<!-- ===== 页面头部 ===== -->
<header class="page-header">
  <div class="container">
    <div class="d-flex align-items-center justify-content-between flex-wrap">
      <div>
        <h1 class="mb-1">
          <i class="fas fa-cloud-upload-alt me-2"></i>文件上传示例
        </h1>
        <p class="mb-0">
          <i class="fas fa-code me-1"></i> Thymeleaf + Bootstrap 5 + jQuery &nbsp;·&nbsp;
          <span class="badge bg-light text-dark fw-normal">FSS 统一存储</span>
        </p>
      </div>
      <div class="mt-2 mt-sm-0">
                    <span class="badge bg-light text-primary fs-6 py-2 px-3">
                        <i class="fas fa-upload me-1"></i> /api/file-storage-spring/upload/single
                    </span>
      </div>
    </div>
  </div>
</header>

<!-- ===== 主体内容 ===== -->
<div class="container pb-5">

  <div class="row g-4">

    <!-- ===== 左侧：上传表单 ===== -->
    <div class="col-lg-7">
      <div class="card card-upload">
        <div class="card-body p-4 p-md-5">

          <h5 class="card-title mb-3">
            <i class="fas fa-pen-alt text-primary me-2"></i>上传配置
          </h5>
          <p class="text-muted small mb-4">
            选择文件并填写可选参数，点击上传按钮完成文件上传。
          </p>

          <!-- 表单 -->
          <form id="uploadForm" novalidate>

            <!-- 文件选择（拖拽区域） -->
            <div class="mb-4">
              <label class="form-label fw-semibold">
                <i class="fas fa-file text-primary me-1"></i> 选择文件
                <span class="text-danger">*</span>
              </label>
              <div class="drop-zone" id="dropZone">
                <div class="icon">
                  <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <div class="text-muted">
                  拖拽文件到此处，或 <strong class="text-primary">点击选择</strong>
                </div>
                <div class="mt-2" id="fileInfo">
                  <span class="file-name" id="fileNameDisplay">未选择文件</span>
                  <span class="text-muted ms-2" id="fileSizeDisplay"></span>
                </div>
                <input type="file" id="fileInput" name="file" accept="*/*" />
              </div>
              <div class="form-text text-muted small">
                <i class="fas fa-info-circle me-1"></i> 支持所有文件类型，单个文件大小不限（受服务端限制）
              </div>
            </div>

            <!-- 可选参数 -->
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="platformInput">
                  <i class="fas fa-server text-secondary me-1"></i> 存储平台
                </label>
                <input type="text" class="form-control" id="platformInput"
                       name="platform" placeholder="例如：aliyun-oss / tencent-cos"
                       aria-describedby="platformHelp" />
                <div id="platformHelp" class="form-text text-muted small">
                  可选，指定文件存储平台
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="objectIdInput">
                  <i class="fas fa-hashtag text-secondary me-1"></i> 对象 ID
                </label>
                <input type="text" class="form-control" id="objectIdInput"
                       name="objectId" placeholder="例如：user-12345"
                       aria-describedby="objectIdHelp" />
                <div id="objectIdHelp" class="form-text text-muted small">
                  可选，文件所属对象标识
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="objectTypeInput">
                  <i class="fas fa-tag text-secondary me-1"></i> 对象类型
                </label>
                <input type="text" class="form-control" id="objectTypeInput"
                       name="objectType" placeholder="例如：avatar / product-image"
                       aria-describedby="objectTypeHelp" />
                <div id="objectTypeHelp" class="form-text text-muted small">
                  可选，文件所属对象类型
                </div>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold" for="saveFilenameInput">
                  <i class="fas fa-pen text-secondary me-1"></i> 保存文件名
                </label>
                <input type="text" class="form-control" id="saveFilenameInput"
                       name="saveFilename" placeholder="自定义存储文件名"
                       aria-describedby="saveFilenameHelp" />
                <div id="saveFilenameHelp" class="form-text text-muted small">
                  可选，不指定则使用原始文件名
                </div>
              </div>
            </div>

            <!-- 操作按钮 -->
            <div class="d-flex gap-3 mt-4 pt-2">
              <button type="button" class="btn btn-primary btn-lg px-5" id="uploadBtn" disabled>
                <i class="fas fa-upload me-2"></i>上传文件
              </button>
              <button type="reset" class="btn btn-outline-secondary" id="resetBtn">
                <i class="fas fa-undo me-1"></i>重置
              </button>
            </div>

            <!-- 进度条 -->
            <div class="mt-4" id="progressWrapper" style="display:none;">
              <div class="d-flex justify-content-between align-items-center mb-1">
                                    <span class="small fw-semibold text-secondary">
                                        <i class="fas fa-spinner fa-spin me-1"></i>上传进度
                                    </span>
                <span class="small fw-semibold" id="progressPercent">0%</span>
              </div>
              <div class="progress progress-upload">
                <div class="progress-bar" id="progressBar" role="progressbar"
                     style="width:0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                </div>
              </div>
            </div>

          </form>
        </div>
      </div>
    </div>

    <!-- ===== 右侧：结果展示 ===== -->
    <div class="col-lg-5">
      <div class="card card-upload h-100">
        <div class="card-body p-4 p-md-5 d-flex flex-column">

          <h5 class="card-title mb-3">
            <i class="fas fa-chart-bar text-success me-2"></i>上传结果
          </h5>
          <p class="text-muted small mb-4" id="resultHint">
            <i class="fas fa-info-circle me-1"></i> 上传完成后，文件信息将在此展示
          </p>

          <!-- 结果占位 / 内容 -->
          <div id="resultContainer" class="flex-grow-1">
            <!-- 空状态 -->
            <div id="emptyState" class="text-center py-5">
              <i class="fas fa-inbox text-secondary" style="font-size:3rem; opacity:0.3;"></i>
              <p class="text-muted mt-3 mb-0">暂无上传记录</p>
            </div>

            <!-- 成功结果 -->
            <div id="successResult" style="display:none;">
              <!-- 缩略图预览 -->
              <div class="text-center mb-3" id="previewContainer">
                <!-- 动态生成 -->
              </div>
              <!-- 表格 -->
              <div class="response-card">
                <div class="card-header">
                  <i class="fas fa-file-alt me-1"></i> 文件信息
                  <span class="badge bg-success ms-2" id="statusBadge">上传成功</span>
                </div>
                <div class="card-body p-0">
                  <table class="table response-table" id="resultTable">
                    <tbody id="resultBody">
                    <!-- 动态渲染 -->
                    </tbody>
                  </table>
                </div>
              </div>
              <!-- 快捷操作 -->
              <div class="mt-3 d-flex gap-2 flex-wrap">
                <button class="btn btn-sm btn-outline-primary" id="copyUrlBtn" style="display:none;">
                  <i class="fas fa-copy me-1"></i>复制链接
                </button>
                <a href="#" id="fileUrlLink" target="_blank" class="btn btn-sm btn-outline-success" style="display:none;">
                  <i class="fas fa-external-link-alt me-1"></i>打开文件
                </a>
              </div>
            </div>

            <!-- 错误结果 -->
            <div id="errorResult" style="display:none;">
              <div class="response-card border-danger">
                <div class="card-header bg-danger bg-opacity-10 text-danger border-danger">
                  <i class="fas fa-exclamation-triangle me-1"></i> 上传失败
                </div>
                <div class="card-body p-3">
                  <div class="d-flex align-items-start">
                    <i class="fas fa-times-circle text-danger me-2 mt-1" style="font-size:1.25rem;"></i>
                    <div>
                      <div class="fw-semibold" id="errorMessage">未知错误</div>
                      <div class="text-muted small mt-1" id="errorDetail"></div>
                      <div class="text-muted small mt-1" id="errorCode"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

</div>

<!-- ===== JavaScript ===== -->
<!-- jQuery 3.x -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js">
</script>
<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

<script>
  $(function() {

    // ========================================
    // 1. DOM 引用
    // ========================================
    const $fileInput = $('#fileInput');
    const $dropZone = $('#dropZone');
    const $fileNameDisplay = $('#fileNameDisplay');
    const $fileSizeDisplay = $('#fileSizeDisplay');
    const $uploadBtn = $('#uploadBtn');
    const $resetBtn = $('#resetBtn');
    const $progressWrapper = $('#progressWrapper');
    const $progressBar = $('#progressBar');
    const $progressPercent = $('#progressPercent');

    const $emptyState = $('#emptyState');
    const $successResult = $('#successResult');
    const $errorResult = $('#errorResult');
    const $resultBody = $('#resultBody');
    const $previewContainer = $('#previewContainer');
    const $resultHint = $('#resultHint');
    const $errorMessage = $('#errorMessage');
    const $errorDetail = $('#errorDetail');
    const $errorCode = $('#errorCode');
    const $copyUrlBtn = $('#copyUrlBtn');
    const $fileUrlLink = $('#fileUrlLink');
    const $statusBadge = $('#statusBadge');

    // Toast
    const toastEl = document.getElementById('liveToast');
    const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
    const $toastMessage = $('#toastMessage');

    // ========================================
    // 2. 工具函数
    // ========================================

    /** 格式化文件大小 */
    function formatSize(bytes) {
      if (!bytes || bytes === 0) return '-';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      const size = (bytes / Math.pow(1024, i)).toFixed(i > 0 ? 1 : 0);
      return size + ' ' + units[i];
    }

    /** 格式化时间戳 (ISO -> 本地) */
    function formatDate(isoStr) {
      if (!isoStr) return '-';
      try {
        const d = new Date(isoStr);
        if (isNaN(d.getTime())) return isoStr;
        return d.toLocaleString('zh-CN', {
          year: 'numeric',
          month: '2-digit',
          day: '2-digit',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit'
        });
      } catch (_) { return isoStr; }
    }

    /** 安全获取嵌套属性 */
    function safeGet(obj, path, fallback = '-') {
      try {
        const parts = path.split('.');
        let val = obj;
        for (const p of parts) {
          if (val == null) return fallback;
          val = val[p];
        }
        return val != null ? val : fallback;
      } catch (_) { return fallback; }
    }

    /** 判断是否为图片 */
    function isImage(ext) {
      if (!ext) return false;
      const images = ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg', 'ico', 'tiff', 'tif'];
      return images.includes(ext.toLowerCase());
    }

    /** 显示 Toast 消息 */
    function showToast(message, type) {
      const bg = type === 'success' ? 'bg-success' :
          type === 'error' ? 'bg-danger' : 'bg-primary';
      const icon = type === 'success' ? 'check-circle' :
          type === 'error' ? 'exclamation-circle' : 'info-circle';
      $toastMessage.html(`<i class="fas fa-${icon} me-2"></i> ${message}`);
      toastEl.className = `toast align-items-center border-0 ${bg} text-white`;
      toast.show();
    }

    /** 重置页面状态（保留文件选择） */
    function resetUI() {
      $successResult.hide();
      $errorResult.hide();
      $emptyState.show();
      $progressWrapper.hide();
      $progressBar.css('width', '0%');
      $progressPercent.text('0%');
      $resultHint.html('<i class="fas fa-info-circle me-1"></i> 上传完成后，文件信息将在此展示');
      $copyUrlBtn.hide();
      $fileUrlLink.hide();
      $('#previewContainer').empty();
      // 重置表单状态
      $uploadBtn.prop('disabled', true);
    }

    /** 渲染 FileInfo 到表格 */
    function renderFileInfo(data) {
      // 定义字段分组
      const fields = [
        { label: '文件 ID', key: 'id', fallback: '-' },
        { label: '文件名', key: 'filename', fallback: '-' },
        { label: '原始文件名', key: 'originalFilename', fallback: '-' },
        { label: '文件大小', key: 'size', fallback: '-', formatter: formatSize },
        { label: '扩展名', key: 'ext', fallback: '-' },
        { label: 'MIME 类型', key: 'contentType', fallback: '-' },
        { label: '存储平台', key: 'platform', fallback: '-' },
        { label: '访问地址', key: 'url', fallback: '-', isLink: true },
        { label: '基础路径', key: 'basePath', fallback: '-' },
        { label: '存储路径', key: 'path', fallback: '-' },
        { label: '对象 ID', key: 'objectId', fallback: '-' },
        { label: '对象类型', key: 'objectType', fallback: '-' },
        { label: '创建时间', key: 'createTime', fallback: '-', formatter: formatDate },
        { label: '缩略图地址', key: 'thUrl', fallback: '-', isLink: true },
        { label: '缩略图文件名', key: 'thFilename', fallback: '-' },
        { label: '缩略图大小', key: 'thSize', fallback: '-', formatter: formatSize },
        { label: '缩略图 MIME', key: 'thContentType', fallback: '-' },
        { label: '上传 ID', key: 'uploadId', fallback: '-' },
        { label: '上传状态', key: 'uploadStatus', fallback: '-',
          formatter: v => ({ 1: '初始化完成', 2: '上传完成' } [v] || v) },
      ];

      let html = '';
      for (const f of fields) {
        let val = safeGet(data, f.key, f.fallback);
        if (f.formatter && val !== '-') val = f.formatter(val);
        // 链接渲染
        let displayVal = val;
        if (f.isLink && val !== '-' && val !== '' && val !== null) {
          displayVal =
              `<a href="${val}" target="_blank" class="text-primary text-decoration-none">${val}</a>`;
        }
        html += `
                        <tr>
                            <th class="label-group">${f.label}</th>
                            <td>${displayVal}</td>
                        </tr>
                    `;
      }

      // 处理 metadata (Map)
      const metadata = safeGet(data, 'metadata', {});
      const userMetadata = safeGet(data, 'userMetadata', {});
      if (typeof metadata === 'object' && metadata !== null && Object.keys(metadata).length > 0) {
        html += `
                        <tr>
                            <th class="label-group">元数据 (metadata)</th>
                            <td>${renderMetaMap(metadata)}</td>
                        </tr>
                    `;
      }
      if (typeof userMetadata === 'object' && userMetadata !== null && Object.keys(userMetadata).length > 0) {
        html += `
                        <tr>
                            <th class="label-group">用户元数据 (userMetadata)</th>
                            <td>${renderMetaMap(userMetadata)}</td>
                        </tr>
                    `;
      }

      // 处理 hashInfo
      const hashInfo = safeGet(data, 'hashInfo', {});
      if (typeof hashInfo === 'object' && hashInfo !== null && Object.keys(hashInfo).length > 0) {
        const hashParts = [];
        for (const [k, v] of Object.entries(hashInfo)) {
          if (v) hashParts.push(`<span class="meta-tag"><strong>${k}</strong> ${v}</span>`);
        }
        if (hashParts.length) {
          html += `
                            <tr>
                                <th class="label-group">哈希信息</th>
                                <td>${hashParts.join(' ')}</td>
                            </tr>
                        `;
        }
      }

      // 处理 attr (Dict)
      const attr = safeGet(data, 'attr', {});
      if (typeof attr === 'object' && attr !== null && Object.keys(attr).length > 0) {
        const attrParts = [];
        for (const [k, v] of Object.entries(attr)) {
          if (v != null) attrParts.push(`<span class="meta-tag"><strong>${k}</strong> ${v}</span>`);
        }
        if (attrParts.length) {
          html += `
                            <tr>
                                <th class="label-group">附加属性 (attr)</th>
                                <td>${attrParts.join(' ')}</td>
                            </tr>
                        `;
        }
      }

      $resultBody.html(html);
    }

    /** 渲染元数据 Map */
    function renderMetaMap(map) {
      if (!map || typeof map !== 'object') return '-';
      const parts = [];
      for (const [k, v] of Object.entries(map)) {
        if (v != null) parts.push(`<span class="meta-tag"><strong>${k}</strong> ${v}</span>`);
      }
      return parts.length ? parts.join(' ') : '<span class="text-muted">空</span>';
    }

    /** 渲染预览缩略图 */
    function renderPreview(fileInfo) {
      const $container = $('#previewContainer');
      $container.empty();

      // 如果有缩略图地址，优先使用
      const thUrl = safeGet(fileInfo, 'thUrl', null);
      const url = safeGet(fileInfo, 'url', null);
      const ext = safeGet(fileInfo, 'ext', '');
      const filename = safeGet(fileInfo, 'filename', 'file');

      let previewHtml = '';

      // 判断是否有可预览的图片
      const hasImagePreview = (thUrl && isImage(ext)) || (url && isImage(ext));

      if (hasImagePreview) {
        const imgSrc = thUrl || url;
        previewHtml = `
                        <img src="${imgSrc}" alt="${filename}" class="file-preview"
                             onerror="this.style.display='none'" />
                    `;
      } else {
        // 显示文件图标
        const iconMap = {
          'pdf': 'fa-file-pdf text-danger',
          'doc': 'fa-file-word text-primary',
          'docx': 'fa-file-word text-primary',
          'xls': 'fa-file-excel text-success',
          'xlsx': 'fa-file-excel text-success',
          'ppt': 'fa-file-powerpoint text-warning',
          'pptx': 'fa-file-powerpoint text-warning',
          'zip': 'fa-file-archive text-secondary',
          'rar': 'fa-file-archive text-secondary',
          '7z': 'fa-file-archive text-secondary',
          'tar': 'fa-file-archive text-secondary',
          'gz': 'fa-file-archive text-secondary',
          'txt': 'fa-file-alt text-secondary',
          'md': 'fa-file-alt text-secondary',
          'json': 'fa-file-code text-info',
          'xml': 'fa-file-code text-info',
          'html': 'fa-file-code text-info',
          'css': 'fa-file-code text-info',
          'js': 'fa-file-code text-warning',
          'java': 'fa-file-code text-danger',
          'py': 'fa-file-code text-primary',
          'go': 'fa-file-code text-info',
          'mp4': 'fa-file-video text-primary',
          'avi': 'fa-file-video text-primary',
          'mkv': 'fa-file-video text-primary',
          'mp3': 'fa-file-audio text-success',
          'wav': 'fa-file-audio text-success',
          'flac': 'fa-file-audio text-success',
          'exe': 'fa-file-exe text-secondary',
          'apk': 'fa-file-exe text-secondary',
        };
        const icon = iconMap[ext] || 'fa-file text-secondary';
        previewHtml = `
                        <div class="file-preview-placeholder">
                            <i class="fas ${icon}"></i>
                        </div>
                    `;
      }

      // 添加文件名标签
      previewHtml += `
                    <div class="mt-2 small text-muted">
                        <i class="fas fa-file me-1"></i> ${filename}
                        ${ext ? `<span class="badge bg-light text-dark ms-1">.${ext}</span>` : ''}
                    </div>
                `;

      $container.html(previewHtml);

      // 设置快捷链接
      if (url && url !== '-' && url !== null && url !== '') {
        $fileUrlLink.attr('href', url).show();
        $copyUrlBtn.show();
      } else {
        $fileUrlLink.hide();
        $copyUrlBtn.hide();
      }
    }

    // ========================================
    // 3. 事件绑定
    // ========================================

    // 3.1 文件选择
    $fileInput.on('change', function() {
      const file = this.files[0];
      if (file) {
        $fileNameDisplay.text(file.name);
        $fileSizeDisplay.text('(' + formatSize(file.size) + ')');
        $uploadBtn.prop('disabled', false);
        // 修改 dropZone 样式
        $dropZone.find('.icon i').removeClass('fa-cloud-upload-alt').addClass('fa-file-check text-primary');
        $dropZone.find('.text-muted').html(
            `已选择: <strong class="text-primary">${file.name}</strong>`);
      } else {
        resetFileSelect();
      }
    });

    function resetFileSelect() {
      $fileNameDisplay.text('未选择文件');
      $fileSizeDisplay.text('');
      $uploadBtn.prop('disabled', true);
      $dropZone.find('.icon i').removeClass('fa-file-check').addClass('fa-cloud-upload-alt');
      $dropZone.find('.text-muted').html(
          '拖拽文件到此处，或 <strong class="text-primary">点击选择</strong>');
    }

    // 3.2 拖拽支持
    $dropZone.on('dragover', function(e) {
      e.preventDefault();
      $(this).addClass('dragover');
    }).on('dragleave', function(e) {
      e.preventDefault();
      $(this).removeClass('dragover');
    }).on('drop', function(e) {
      e.preventDefault();
      $(this).removeClass('dragover');
      const files = e.originalEvent.dataTransfer.files;
      if (files.length) {
        $fileInput[0].files = files;
        $fileInput.trigger('change');
      }
    });

    // 3.3 重置按钮
    $resetBtn.on('click', function() {
      $fileInput.val('');
      resetFileSelect();
      resetUI();
      // 清空参数
      $('#platformInput').val('');
      $('#objectIdInput').val('');
      $('#objectTypeInput').val('');
      $('#saveFilenameInput').val('');
      // 清除预览
      $('#previewContainer').empty();
      $resultHint.html('<i class="fas fa-info-circle me-1"></i> 上传完成后，文件信息将在此展示');
      $emptyState.show();
      $successResult.hide();
      $errorResult.hide();
      showToast('已重置表单', 'info');
    });

    // 3.4 上传按钮
    $uploadBtn.on('click', function() {
      const file = $fileInput[0].files[0];
      if (!file) {
        showToast('请先选择一个文件', 'error');
        return;
      }

      // 构建 FormData
      const formData = new FormData();
      formData.append('file', file);

      const platform = $('#platformInput').val().trim();
      const objectId = $('#objectIdInput').val().trim();
      const objectType = $('#objectTypeInput').val().trim();
      const saveFilename = $('#saveFilenameInput').val().trim();

      if (platform) formData.append('platform', platform);
      if (objectId) formData.append('objectId', objectId);
      if (objectType) formData.append('objectType', objectType);
      if (saveFilename) formData.append('saveFilename', saveFilename);

      // 显示进度条
      $progressWrapper.show();
      $progressBar.css('width', '0%');
      $progressPercent.text('0%');

      // 隐藏旧结果
      $emptyState.hide();
      $successResult.hide();
      $errorResult.hide();
      $resultHint.html('<i class="fas fa-spinner fa-spin me-1"></i> 正在上传...');

      // 禁用按钮
      $uploadBtn.prop('disabled', true).html(
          '<i class="fas fa-spinner fa-spin me-2"></i>上传中...');

      // ===== AJAX 上传 =====
      $.ajax({
        url: '/api/file-storage-spring/upload/single',
        type: 'POST',
        data: formData,
        contentType: false,
        processData: false,
        xhr: function() {
          const xhr = new XMLHttpRequest();
          xhr.upload.addEventListener('progress', function(e) {
            if (e.lengthComputable) {
              const pct = Math.round((e.loaded / e.total) * 100);
              $progressBar.css('width', pct + '%');
              $progressPercent.text(pct + '%');
            }
          });
          return xhr;
        },
        success: function(data) {
          // 上传成功
          $progressBar.css('width', '100%');
          $progressPercent.text('100%');

          // 延迟一下显示效果
          setTimeout(function() {
            $progressWrapper.hide();
            $uploadBtn.prop('disabled', false).html(
                '<i class="fas fa-upload me-2"></i>上传文件');

            // 渲染结果
            $emptyState.hide();
            $errorResult.hide();
            $successResult.show();
            $statusBadge.text('上传成功').removeClass('bg-danger').addClass('bg-success');

            renderFileInfo(data.data);
            renderPreview(data.data);
            $resultHint.html(
                '<i class="fas fa-check-circle text-success me-1"></i> 上传成功！文件信息如下：'
            );

            showToast('文件上传成功！', 'success');

            // 存储 url 用于复制
            const url = data.url || '';
            if (url) {
              $copyUrlBtn.data('url', url);
            }

          }, 400);
        },
        error: function(xhr) {
          // 上传失败
          $progressWrapper.hide();
          $uploadBtn.prop('disabled', false).html(
              '<i class="fas fa-upload me-2"></i>上传文件');

          let errorMsg = '上传失败，请稍后重试';
          let errorDetail = '';
          let errorCode = '';

          try {
            // 尝试解析 Result 错误对象
            const resp = xhr.responseJSON;
            if (resp) {
              if (resp.message) errorMsg = resp.message;
              if (resp.code) errorCode = '错误码: ' + resp.code;
              if (resp.error && resp.error.detail) errorDetail = resp.error.detail;
              if (!errorDetail && resp.error && resp.error.params) {
                const params = resp.error.params;
                if (Array.isArray(params) && params.length) {
                  errorDetail = params.map(p => {
                    if (Array.isArray(p) && p.length === 2) {
                      return p[0] + ' = ' + p[1];
                    }
                    return JSON.stringify(p);
                  }).join('; ');
                }
              }
              // 如果 data 中有错误信息
              if (!errorMsg && resp.data && resp.data.message) {
                errorMsg = resp.data.message;
              }
            } else if (xhr.responseText) {
              // 尝试解析纯文本
              try {
                const parsed = JSON.parse(xhr.responseText);
                if (parsed.message) errorMsg = parsed.message;
              } catch (_) {
                // 不是 JSON
                if (xhr.responseText.length < 200) {
                  errorMsg = xhr.responseText;
                }
              }
            }
          } catch (_) { /* ignore */ }

          // 如果 HTTP 状态码有含义
          if (xhr.status === 413) {
            errorMsg = '文件过大，超出服务器限制';
          } else if (xhr.status === 400) {
            errorMsg = '请求参数错误: ' + (errorMsg || '请检查文件或参数');
          } else if (xhr.status === 500) {
            errorMsg = '服务器内部错误，请稍后重试';
          }

          $emptyState.hide();
          $successResult.hide();
          $errorResult.show();
          $errorMessage.text(errorMsg);
          $errorDetail.text(errorDetail || '');
          $errorCode.text(errorCode || '');

          $resultHint.html(
              '<i class="fas fa-times-circle text-danger me-1"></i> 上传失败，请检查后重试'
          );

          showToast(errorMsg, 'error');
        }
      });
    });

    // 3.5 复制链接
    $copyUrlBtn.on('click', function() {
      const url = $(this).data('url');
      if (!url) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function() {
          showToast('链接已复制到剪贴板', 'success');
        }).catch(function() {
          fallbackCopy(url);
        });
      } else {
        fallbackCopy(url);
      }
    });

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      ta.style.top = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('链接已复制到剪贴板', 'success');
      } catch (_) {
        showToast('复制失败，请手动复制', 'error');
      }
      document.body.removeChild(ta);
    }

    // ========================================
    // 4. 初始化
    // ========================================
    resetUI();

    // 支持回车键触发展开（但文件选择需要点击）
    // 无额外操作

    console.log('📁 FSS 文件上传示例已加载');
    console.log('📌 接口: POST /api/file-storage-spring/upload/single');
    console.log('📌 参数: file(必填), platform, objectId, objectType, saveFilename');

  });
</script>

</body>
</html>
