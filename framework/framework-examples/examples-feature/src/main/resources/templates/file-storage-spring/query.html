<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件存储管理系统</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome 6 图标库 -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <!-- jQuery 3.6 -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js">
  </script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">
  </script>

  <style>
    /* ========== 全局样式 ========== */
    body {
      background-color: #f5f7fb;
      font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
    }

    /* ========== 导航栏 ========== */
    .navbar-custom {
      background: linear-gradient(135deg, #1a2035 0%, #2d3a52 100%);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      padding: 0.75rem 0;
    }
    .navbar-custom .navbar-brand {
      font-weight: 600;
      font-size: 1.3rem;
      color: #fff;
      letter-spacing: 0.5px;
    }
    .navbar-custom .navbar-brand i {
      margin-right: 10px;
      color: #64b5f6;
    }
    .navbar-custom .badge-api {
      background: rgba(255, 255, 255, 0.12);
      color: #aab;
      font-weight: 400;
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      margin-left: 12px;
    }

    /* ========== 卡片容器 ========== */
    .main-card {
      border: none;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      overflow: hidden;
      margin-top: 24px;
    }
    .main-card .card-header {
      background: #fff;
      border-bottom: 1px solid #f0f2f5;
      padding: 1rem 1.5rem;
      font-weight: 600;
      font-size: 1rem;
      color: #1a2035;
    }
    .main-card .card-header i {
      color: #4a6cf7;
      margin-right: 8px;
    }

    /* ========== 搜索栏 ========== */
    .search-section {
      background: #fff;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #f0f2f5;
    }
    .search-section .input-group {
      max-width: 380px;
    }
    .search-section .input-group .form-control {
      border-radius: 8px 0 0 8px;
      border-color: #e2e8f0;
      font-size: 0.9rem;
    }
    .search-section .input-group .btn {
      border-radius: 0 8px 8px 0;
      padding: 0 1.2rem;
    }
    .search-section .id-query-group {
      max-width: 320px;
    }
    .search-section .id-query-group .form-control {
      border-radius: 8px 0 0 8px;
      border-color: #e2e8f0;
      font-size: 0.9rem;
    }
    .search-section .id-query-group .btn {
      border-radius: 0 8px 8px 0;
    }
    .search-section .divider {
      width: 1px;
      height: 34px;
      background: #e2e8f0;
      margin: 0 18px;
    }
    @media (max-width: 768px) {
      .search-section .divider {
        display: none;
      }
      .search-section .input-group,
      .search-section .id-query-group {
        max-width: 100%;
        margin-bottom: 10px;
      }

    /* ========== 表格 ========== */
    .table-container {
      padding: 0 1.5rem 1rem 1.5rem;
      overflow-x: auto;
    }
    .table-container .table {
      margin-bottom: 0;
      font-size: 0.9rem;
    }
    .table-container .table thead th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      border-bottom: 2px solid #e9edf2;
      padding: 0.8rem 0.6rem;
      white-space: nowrap;
    }
    .table-container .table tbody td {
      padding: 0.7rem 0.6rem;
      vertical-align: middle;
      border-bottom: 1px solid #f0f2f5;
    }
    .table-container .table tbody tr {
      transition: background 0.15s;
      cursor: pointer;
    }
    .table-container .table tbody tr:hover {
      background: #f8faff;
    }
    .table-container .table .file-size {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 0.8rem;
      color: #64748b;
    }
    .table-container .table .file-type {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      background: #eef2f6;
      color: #475569;
      display: inline-block;
    }
    .table-container .table .file-platform {
      font-size: 0.75rem;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      background: #e8f0fe;
      color: #1a5bbf;
      display: inline-block;
    }
    .table-container .table .file-id {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 0.75rem;
      color: #94a3b8;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

    }
    .table-container .empty-state {
      text-align: center;
      padding: 3rem 0;
      color: #94a3b8;
    }
    .table-container .empty-state i {
      font-size: 3rem;
      color: #cbd5e1;
      margin-bottom: 0.8rem;
    }
    .table-container .empty-state p {
      font-size: 1rem;
    }

    /* ========== 分页 ========== */
    .pagination-section {
      padding: 0.8rem 1.5rem 1.2rem 1.5rem;
      border-top: 1px solid #f0f2f5;
      background: #fafbfc;
      border-radius: 0 0 16px 16px;
    }
    .pagination-section .page-info {
      color: #64748b;
      font-size: 0.9rem;
    }
    .pagination-section .pagination .page-link {
      border-color: #e2e8f0;
      color: #1a2035;
      font-size: 0.85rem;
      padding: 0.35rem 0.8rem;
    }
    .pagination-section .pagination .page-item.active .page-link {
      background: #4a6cf7;
      border-color: #4a6cf7;
      color: #fff;
    }
    .pagination-section .pagination .page-item.disabled .page-link {
      color: #b0b8c4;
    }
    .pagination-section .page-size-select {
      width: 70px;
      font-size: 0.85rem;

    /* ========== 模态框 ========== */
    .modal-content {

    .modal-body {

    }
    .modal-footer {
      border-top: 1px solid #f0f2f5;
      padding: 1rem 1.8rem;

    }

    /* 详情信息网格 */
    .detail-grid {
      display: grid;

      gap: 0.6rem 1.8rem;

    }
    .detail-grid .detail-item {

      align-items: baseline;
      padding: 0.3rem 0;
      border-bottom: 1px dashed #f0f2f5;
    }
    .detail-grid .detail-item .label {
      font-weight: 500;
      color: #64748b;
      font-size: 0.8rem;
      min-width: 80px;

    .detail-grid .detail-item .value {

    }
    .detail-grid .detail-item .value .badge {
      font-weight: 400;

    }
    .detail-grid .detail-item .value .mono {
      font-family: 'SF Mono', 'Menlo', monospace;
      font-size: 0.8rem;
      color: #475569;
    }
    @media (max-width: 576px) {
      .detail-grid {
        grid-template-columns: 1fr;

    }

    /* 分片信息表格 */
    .part-section {
      margin-top: 1.2rem;
    }
    .part-section .part-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: #1a2035;
      margin-bottom: 0.6rem;
    }
    .part-section .part-title i {
      color: #4a6cf7;
      margin-right: 6px;
    }
    .part-section .table {
      font-size: 0.85rem;
      margin-bottom: 0;
    }
    .part-section .table thead th {
      background: #f8fafc;
      color: #475569;
      font-weight: 600;
      font-size: 0.75rem;
      padding: 0.5rem 0.6rem;
    }
    .part-section .table tbody td {
      padding: 0.4rem 0.6rem;
      font-size: 0.82rem;
    }
    .part-section .empty-parts {
      color: #94a3b8;
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    /* ========== 加载动画 ========== */
    .spinner-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
    }
    .spinner-overlay.show {
      display: flex;
    }
    .spinner-overlay .spinner-border {
      width: 3rem;
      height: 3rem;
      color: #4a6cf7;
    }

    /* ========== Toast 通知 ========== */
    .toast-container {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 99999;
    }
    .toast-container .toast {
      border: none;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.12);
      min-width: 280px;
    }
    .toast-container .toast .toast-header {
      border: none;
      background: transparent;
      font-weight: 500;
    }
    .toast-container .toast .toast-body {
      font-size: 0.9rem;
    }

    /* ========== 通用工具 ========== */
    .text-truncate-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .cursor-pointer {
      cursor: pointer;
    }
    .fs-small {
      font-size: 0.78rem;
    }
    .text-muted-light {
      color: #94a3b8;
    }
  </style>
</head>
<body>

<div class="container-fluid px-4">

    <div class="search-section d-flex flex-wrap align-items-center gap-2">

<!-- JavaScript -->
<!-- ============================================================ -->
<script>
  $(function() {

    // ============================================================
    //  状态变量
    // ============================================================
    var currentPage = 0; // 当前页码（从0开始）
    var currentSize = 10; // 每页条数
    var currentFilename = ''; // 当前搜索文件名
    var totalPages = 0;
    var totalElements = 0;
    var currentFileId = null; // 当前查看详情的文件ID
    var currentFileInfo = null; // 当前查看详情的文件信息

    // ============================================================
    //  工具函数
    // ============================================================

    /** 格式化文件大小 */
    function formatFileSize(bytes) {
      if (bytes === null || bytes === undefined || bytes === 0) return '0 B';
      var k = 1024;
      var sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      var i = Math.floor(Math.log(bytes) / Math.log(k));
      var val = (bytes / Math.pow(k, i)).toFixed(i > 0 ? 2 : 0);
      return val + ' ' + sizes[i];
    }

    /** 格式化日期 */
    function formatDate(dateStr) {
      if (!dateStr) return '-';
      try {
        var d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.getFullYear() + '-' +
            String(d.getMonth() + 1).padStart(2, '0') + '-' +
            String(d.getDate()).padStart(2, '0') + ' ' +
            String(d.getHours()).padStart(2, '0') + ':' +
            String(d.getMinutes()).padStart(2, '0') + ':' +
            String(d.getSeconds()).padStart(2, '0');
      } catch (e) {
        return dateStr;
      }
    }

    /** 截断字符串 */
    function truncate(str, maxLen) {
      if (!str) return '-';
      if (str.length <= maxLen) return str;
      return str.substring(0, maxLen) + '…';
    }

    /** 获取文件扩展名（小写） */
    function getExt(filename) {
      if (!filename) return '';
      var idx = filename.lastIndexOf('.');
      return idx > 0 ? filename.substring(idx + 1).toLowerCase() : '';
    }

    /** 根据扩展名获取图标类 */
    function getFileIcon(filename) {
      var ext = getExt(filename);
      var map = {
        'pdf': 'fa-file-pdf',
        'doc': 'fa-file-word',
        'docx': 'fa-file-word',
        'xls': 'fa-file-excel',
        'xlsx': 'fa-file-excel',
        'ppt': 'fa-file-powerpoint',
        'pptx': 'fa-file-powerpoint',
        'jpg': 'fa-file-image',
        'jpeg': 'fa-file-image',
        'png': 'fa-file-image',
        'gif': 'fa-file-image',
        'svg': 'fa-file-image',
        'bmp': 'fa-file-image',
        'webp': 'fa-file-image',
        'mp4': 'fa-file-video',
        'avi': 'fa-file-video',
        'mov': 'fa-file-video',
        'mkv': 'fa-file-video',
        'mp3': 'fa-file-audio',
        'wav': 'fa-file-audio',
        'flac': 'fa-file-audio',
        'zip': 'fa-file-archive',
        'rar': 'fa-file-archive',
        '7z': 'fa-file-archive',
        'tar': 'fa-file-archive',
        'gz': 'fa-file-archive',
        'txt': 'fa-file-alt',
        'md': 'fa-file-alt',
        'json': 'fa-file-code',
        'xml': 'fa-file-code',
        'html': 'fa-file-code',
        'css': 'fa-file-code',
        'js': 'fa-file-code',
        'java': 'fa-file-code',
        'py': 'fa-file-code',
        'go': 'fa-file-code',
        'rs': 'fa-file-code',
      };
      return map[ext] || 'fa-file';
    }

    /** 显示 Toast 通知 */
    function showToast(message, type, title) {
      type = type || 'info';
      title = title || '提示';
      var iconMap = {
        'success': 'fa-check-circle text-success',
        'danger': 'fa-times-circle text-danger',
        'warning': 'fa-exclamation-triangle text-warning',
        'info': 'fa-info-circle text-info'
      };
      var icon = iconMap[type] || iconMap['info'];
      var bgMap = {
        'success': 'border-success',
        'danger': 'border-danger',
        'warning': 'border-warning',
        'info': 'border-info'
      };
      var border = bgMap[type] || bgMap['info'];

      var $container = $('#toastContainer');
      var id = 'toast-' + Date.now();
      var html = [
        '<div class="toast show ' + border + '" id="' + id + '" role="alert" aria-live="assertive" aria-atomic="true">',
        '  <div class="toast-header">',
        '    <i class="fas ' + icon + ' me-2"></i>',
        '    <strong class="me-auto">' + title + '</strong>',
        '    <small class="text-muted">刚刚</small>',
        '    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="关闭"></button>',
        '  </div>',
        '  <div class="toast-body">' + message + '</div>',
        '</div>'
      ].join('');
      $container.append(html);
      // 5秒后自动移除
      setTimeout(function() {
        $('#' + id).remove();
      }, 5000);
    }

    /** 显示加载遮罩 */
    function showLoading(show) {
      if (show) {
        $('#globalSpinner').addClass('show');
      } else {
        $('#globalSpinner').removeClass('show');
      }
    }

    // ============================================================
    //  API 调用
    // ============================================================

    /** 基础 API 路径 */
    var API_BASE = '/api/file-storage-spring';

    /** 分页查询文件列表 */
    function fetchFileList(page, size, filename) {
      showLoading(true);
      page = page || 0;
      size = size || currentSize;
      filename = filename || currentFilename || '';

      var params = {
        page: page,
        size: size
      };
      if (filename.trim()) {
        params.filename = filename.trim();
      }

      $.ajax({
        url: API_BASE + '/query/page',
        method: 'GET',
        data: params,
        dataType: 'json',
        timeout: 30000,
        success: function(resp) {
          showLoading(false);

          var data = resp.data;
          if (data && data.content !== undefined) {
            renderTable(data);
          } else {
            // 兼容直接返回 Page 的情况
            renderTable(resp);
          }
        },
        error: function(xhr) {
          showLoading(false);
          var msg = xhr.status + ' ' + (xhr.statusText || '网络错误');
          showToast('加载文件列表失败: ' + msg, 'danger', '错误');
          renderTable({ content: [], totalElements: 0, totalPages: 0, number: 0, size: size });
        }
      });
    }

    /** 根据 ID 查询文件信息 */
    function fetchFileInfoById(id) {
      if (!id || !id.trim()) {
        showToast('请输入文件 ID', 'warning', '提示');
        return;
      }
      showLoading(true);
      $.ajax({
        url: API_BASE + '/query/' + encodeURIComponent(id.trim()),
        method: 'GET',
        dataType: 'json',
        timeout: 15000,
        success: function(resp) {
          showLoading(false);

            var fileInfo = resp.data;
            if (fileInfo) {
              currentFileId = fileInfo.id;
              currentFileInfo = fileInfo;
              showDetailModal(fileInfo);
            } else {
              showToast('未找到该文件', 'warning', '提示');
            }

        },
        error: function(xhr) {
          showLoading(false);
          var msg = xhr.status + ' ' + (xhr.statusText || '网络错误');
          if (xhr.status === 404) {
            showToast('文件不存在 (ID: ' + id + ')', 'warning', '提示');
          } else {
            showToast('查询失败: ' + msg, 'danger', '错误');
          }
        }
      });
    }

    /** 查询文件分片信息 */
    function fetchFileParts(fileId) {
      if (!fileId) return;
      $.ajax({
        url: API_BASE + '/query/' + encodeURIComponent(fileId) + '/part',
        method: 'GET',
        dataType: 'json',
        timeout: 15000,
        success: function(resp) {

            var parts = resp.data || [];
            renderParts(parts);

        },
        error: function() {
          renderParts([]);
          // 静默失败，不打扰用户
        }
      });
    }

    /** 下载文件（通过新窗口） */
    function downloadFile(fileId, preview) {
      if (!fileId) {
        showToast('请先选择文件', 'warning', '提示');
        return;
      }
      var url = API_BASE + '/download/' + encodeURIComponent(fileId);
      if (preview) {
        url += '?preview=true';
      } else {
        url += '?preview=false';
      }
      // 使用新窗口打开，浏览器会根据 Content-Disposition 决定预览或下载
      window.open(url, '_blank');
    }

    // ============================================================
    //  渲染函数
    // ============================================================

    /** 渲染表格 */
    function renderTable(pageData) {
      var content = pageData.content || [];
      totalElements = pageData.totalElements || 0;
      totalPages = pageData.totalPages || 0;
      currentPage = pageData.number || 0;
      currentSize = pageData.size || currentSize;

      var $tbody = $('#fileTableBody');
      var $empty = $('#emptyState');

      if (!content || content.length === 0) {
        $tbody.empty();
        $empty.show();
        $('#fileTable thead').hide();
      } else {
        $empty.hide();
        $('#fileTable thead').show();
        var rows = [];
        $.each(content, function(idx, item) {
          var rowNum = currentPage * currentSize + idx + 1;
          var icon = getFileIcon(item.originalFilename || item.filename || '');
          rows.push(
              '<tr data-id="' + (item.id || '') + '">',
              '  <td class="text-muted fs-small">' + rowNum + '</td>',
              '  <td>',
              '    <i class="fas ' + icon + ' me-2 text-secondary"></i>',
              '    <span class="fw-500">' + truncate(item.filename || '-', 30) + '</span>',
              '  </td>',
              '  <td><span class="text-muted fs-small">' + truncate(item.originalFilename || '-', 25) +
              '</span></td>',
              '  <td class="file-size">' + formatFileSize(item.size) + '</td>',
              '  <td><span class="file-type">' + (item.contentType || '-') + '</span></td>',
              '  <td><span class="file-platform">' + (item.platform || '-') + '</span></td>',
              '  <td class="fs-small text-muted">' + formatDate(item.createTime) + '</td>',
              '  <td class="text-center">',
              '    <button class="btn btn-sm btn-outline-primary btn-detail" data-id="' + (item.id ||
                  '') + '" title="查看详情">',
              '      <i class="fas fa-eye"></i>',
              '    </button>',
              '    <button class="btn btn-sm btn-outline-success btn-download-quick ms-1" data-id="' + (
                  item.id || '') + '" title="下载">',
              '      <i class="fas fa-download"></i>',
              '    </button>',
              '  </td>',
              '</tr>'
          );
        });
        $tbody.html(rows.join(''));
      }

      // 更新统计
      var start = totalElements > 0 ? currentPage * currentSize + 1 : 0;
      var end = Math.min((currentPage + 1) * currentSize, totalElements);
      $('#pageInfoText').text('第 ' + start + '-' + end + ' 条，共 ' + totalElements + ' 条');
      $('#resultStats').text('共 ' + totalElements + ' 条记录');

      // 渲染分页
      renderPagination();
    }

    /** 渲染分页 */
    function renderPagination() {
      var $nav = $('#paginationNav');
      if (totalPages <= 1) {
        $nav.html('');
        return;
      }
      var html = [];
      // 上一页
      var prevDisabled = currentPage <= 0;
      html.push('<li class="page-item ' + (prevDisabled ? 'disabled' : '') + '">');
      html.push('  <a class="page-link" href="#" data-page="' + (currentPage - 1) + '" aria-label="上一页">');
      html.push('    <span aria-hidden="true">&laquo;</span>');
      html.push('  </a>');
      html.push('</li>');

      // 页码
      var maxShow = 5;
      var half = Math.floor(maxShow / 2);
      var startPage = Math.max(0, currentPage - half);
      var endPage = Math.min(totalPages - 1, currentPage + half);
      if (endPage - startPage < maxShow - 1) {
        if (startPage === 0) {
          endPage = Math.min(totalPages - 1, startPage + maxShow - 1);
        } else if (endPage === totalPages - 1) {
          startPage = Math.max(0, endPage - maxShow + 1);
        }
      }
      for (var i = startPage; i <= endPage; i++) {
        var active = i === currentPage;
        html.push('<li class="page-item ' + (active ? 'active' : '') + '">');
        html.push('  <a class="page-link" href="#" data-page="' + i + '">' + (i + 1) + '</a>');
        html.push('</li>');
      }

      // 下一页
      var nextDisabled = currentPage >= totalPages - 1;
      html.push('<li class="page-item ' + (nextDisabled ? 'disabled' : '') + '">');
      html.push('  <a class="page-link" href="#" data-page="' + (currentPage + 1) + '" aria-label="下一页">');
      html.push('    <span aria-hidden="true">&raquo;</span>');
      html.push('  </a>');
      html.push('</li>');

      $nav.html(html.join(''));
    }

    /** 显示详情模态框 */
    function showDetailModal(fileInfo) {
      if (!fileInfo) return;

      currentFileInfo = fileInfo;
      currentFileId = fileInfo.id;

      var $body = $('#detailModalBody');
      var html = [];

      // 基本信息网格
      html.push('<div class="detail-grid">');
      var fields = [
        { label: '文件 ID', value: fileInfo.id, cls: 'mono' },
        { label: '文件名', value: fileInfo.filename || '-' },
        { label: '原始名称', value: fileInfo.originalFilename || '-' },
        { label: '文件大小', value: formatFileSize(fileInfo.size) },
        { label: '存储路径', value: fileInfo.path || '-', cls: 'mono' },
        { label: '基础路径', value: fileInfo.basePath || '-', cls: 'mono' },
        { label: 'MIME 类型', value: fileInfo.contentType || '-' },
        { label: '文件扩展名', value: fileInfo.ext || '-' },
        { label: '存储平台', value: fileInfo.platform || '-' },
        { label: '对象 ID', value: fileInfo.objectId || '-', cls: 'mono' },
        { label: '对象类型', value: fileInfo.objectType || '-' },
        { label: '上传时间', value: formatDate(fileInfo.createTime) },
        { label: '访问 URL', value: fileInfo.url || '-', cls: 'mono' },
      ];
      if (fileInfo.thUrl) {
        fields.push({ label: '缩略图 URL', value: fileInfo.thUrl, cls: 'mono' });
        fields.push({ label: '缩略图大小', value: formatFileSize(fileInfo.thSize) });
        fields.push({ label: '缩略图 MIME', value: fileInfo.thContentType || '-' });
      }
      $.each(fields, function(idx, f) {
        var val = f.value || '-';
        if (f.cls) {
          val = '<span class="' + f.cls + '">' + val + '</span>';
        }
        html.push(
            '<div class="detail-item">',
            '  <span class="label">' + f.label + '</span>',
            '  <span class="value">' + val + '</span>',
            '</div>'
        );
      });
      html.push('</div>');

      // 附加属性
      if (fileInfo.attr) {
        html.push('<div class="mt-2">');
        html.push('  <span class="badge bg-light text-dark me-2"><i class="fas fa-tags me-1"></i> 附加属性</span>');
        try {
          var attrStr = typeof fileInfo.attr === 'string' ? fileInfo.attr : JSON.stringify(fileInfo.attr);
          html.push('  <code class="fs-small bg-light p-2 d-block rounded" style="white-space:pre-wrap;">' +
              attrStr + '</code>');
        } catch (e) {
          html.push('  <span class="text-muted fs-small">' + (fileInfo.attr || '-') + '</span>');
        }
        html.push('</div>');
      }

      // 分片信息区域（占位，由 fetchFileParts 填充）
      html.push('<div class="part-section" id="partSection">');
      html.push('  <div class="part-title"><i class="fas fa-puzzle-piece"></i> 分片信息</div>');
      html.push('  <div id="partContent"><span class="text-muted fs-small"><i class="fas fa-spinner fa-spin me-1"></i> 加载分片信息...</span></div>');
      html.push('</div>');

      $body.html(html.join(''));

      // 模态框标题显示文件名
      $('#detailModalLabel').html(
          '<i class="fas fa-file-alt me-2"></i> ' +
          truncate(fileInfo.filename || fileInfo.originalFilename || '文件详情', 50)
      );

      // 更新按钮状态
      $('#btnPreview').data('id', fileInfo.id);
      $('#btnDownload').data('id', fileInfo.id);

      // 显示模态框
      var modal = new bootstrap.Modal(document.getElementById('detailModal'));
      modal.show();

      // 加载分片信息
      fetchFileParts(fileInfo.id);
    }

    /** 渲染分片信息 */
    function renderParts(parts) {
      var $container = $('#partContent');
      if (!parts || parts.length === 0) {
        $container.html('<span class="text-muted fs-small"><i class="far fa-circle me-1"></i> 该文件未使用分片上传</span>');
        return;
      }
      // 构建表格
      var html = [
        '<div class="table-responsive">',
        '<table class="table table-sm table-bordered table-striped">',
        '<thead><tr>',
        '<th>#</th>',
        '<th>分片编号</th>',
        '<th>大小</th>',
        '<th>ETag</th>',
        '<th>上传ID</th>',
        '</tr></thead>',
        '<tbody>'
      ];
      $.each(parts, function(idx, p) {
        var partNum = p.partNumber || p.partNum || p.number || (idx + 1);
        var size = p.size || p.partSize || 0;
        var etag = p.etag || p.eTag || p.md5 || '-';
        var uploadId = p.uploadId || p.uploadID || '-';
        html.push(
            '<tr>',
            '<td>' + (idx + 1) + '</td>',
            '<td>' + partNum + '</td>',
            '<td>' + formatFileSize(size) + '</td>',
            '<td><span class="mono fs-small">' + truncate(etag, 20) + '</span></td>',
            '<td><span class="mono fs-small">' + truncate(uploadId, 16) + '</span></td>',
            '</tr>'
        );
      });
      html.push('</tbody></table></div>');
      $container.html(html.join(''));
    }

    // ============================================================
    //  事件绑定
    // ============================================================

    /** 搜索按钮 */
    $('#btnSearch').on('click', function() {
      currentFilename = $('#searchFilename').val().trim();
      currentPage = 0;
      fetchFileList(0, currentSize, currentFilename);
    });
    $('#searchFilename').on('keypress', function(e) {
      if (e.key === 'Enter') {
        $('#btnSearch').click();
      }
    });

    /** ID 查询按钮 */
    $('#btnQueryById').on('click', function() {
      var id = $('#queryId').val().trim();
      if (!id) {
        showToast('请输入文件 ID', 'warning', '提示');
        return;
      }
      fetchFileInfoById(id);
    });
    $('#queryId').on('keypress', function(e) {
      if (e.key === 'Enter') {
        $('#btnQueryById').click();
      }
    });

    /** 刷新按钮 */
    $('#btnRefresh').on('click', function() {
      fetchFileList(currentPage, currentSize, currentFilename);
      showToast('列表已刷新', 'success', '成功');
    });

    /** 分页点击（事件委托） */
    $('#paginationNav').on('click', 'a.page-link', function(e) {
      e.preventDefault();
      var page = parseInt($(this).data('page'));
      if (isNaN(page) || page < 0 || page >= totalPages) return;
      if (page === currentPage) return;
      currentPage = page;
      fetchFileList(page, currentSize, currentFilename);
    });

    /** 每页条数变更 */
    $('#pageSizeSelect').on('change', function() {
      currentSize = parseInt($(this).val());
      currentPage = 0;
      fetchFileList(0, currentSize, currentFilename);
    });

    /** 表格行点击 - 查看详情（事件委托） */
    $('#fileTableBody').on('click', 'tr', function() {
      var id = $(this).data('id');
      if (id) {
        fetchFileInfoById(id);
      }
    });

    /** 表格内详情按钮（阻止行点击冒泡） */
    $('#fileTableBody').on('click', '.btn-detail', function(e) {
      e.stopPropagation();
      var id = $(this).data('id');
      if (id) {
        fetchFileInfoById(id);
      }
    });

    /** 表格内快速下载按钮 */
    $('#fileTableBody').on('click', '.btn-download-quick', function(e) {
      e.stopPropagation();
      var id = $(this).data('id');
      if (id) {
        downloadFile(id, false);
      }
    });

    /** 模态框 - 预览按钮 */
    $('#btnPreview').on('click', function() {
      var id = $(this).data('id');
      if (id) {
        downloadFile(id, true);
      } else {
        showToast('请先选择文件', 'warning', '提示');
      }
    });

    /** 模态框 - 下载按钮 */
    $('#btnDownload').on('click', function() {
      var id = $(this).data('id');
      if (id) {
        downloadFile(id, false);
      } else {
        showToast('请先选择文件', 'warning', '提示');
      }
    });

    // ============================================================
    //  初始化
    // ============================================================

    /** 更新头部时间 */
    function updateHeaderTime() {
      var now = new Date();
      var str = now.getFullYear() + '-' +
          String(now.getMonth() + 1).padStart(2, '0') + '-' +
          String(now.getDate()).padStart(2, '0') + ' ' +
          String(now.getHours()).padStart(2, '0') + ':' +
          String(now.getMinutes()).padStart(2, '0');
      $('#headerTime').text(str);
    }
    updateHeaderTime();
    setInterval(updateHeaderTime, 60000);

    /** 加载初始数据 */
    fetchFileList(0, currentSize, '');

    // 点击模态框外部不关闭（防止误触）
    // 但保留默认行为

    console.log('📁 文件存储管理系统已启动');
    console.log('🔗 API 地址: ' + API_BASE);

  });
</script>

</body>
</html>
