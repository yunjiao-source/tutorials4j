<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>短信发送示例</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- jQuery (必须放在 Bootstrap JS 之前) -->
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"
          integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8="
          crossorigin="anonymous"></script>
  <!-- Bootstrap 5 JS Bundle (包含 Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0">📨 发送短信</h4>
        </div>
        <hr class="my-3">
        <div class="alert alert-secondary alert-dismissible fade show" role="alert">
          💡 后端可切换消息中间件，如：nats, rabbit, kafka
        </div>
        <div class="card-body">
          <!-- 消息内容输入 -->
          <div class="mb-3">
            <label for="messageInput" class="form-label">短信内容</label>
            <textarea class="form-control" id="messageInput" rows="3"
                      placeholder="请输入要发送的短信内容..."></textarea>
          </div>
          <!-- 发送按钮 -->
          <button id="sendBtn" class="btn btn-primary w-100">
            <span id="btnText">发送</span>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
          </button>
        </div>
        <div class="card-footer">
          <!-- 显示返回结果 -->
          <div id="resultArea" class="mt-2">
            <div id="resultAlert" class="alert d-none" role="alert"></div>
            <div id="detailInfo" class="small text-muted"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script th:inline="javascript">
  $(document).ready(function() {
    const $sendBtn = $('#sendBtn');
    const $btnText = $('#btnText');
    const $btnSpinner = $('#btnSpinner');
    const $messageInput = $('#messageInput');
    const $resultAlert = $('#resultAlert');
    const $detailInfo = $('#detailInfo');

    // 发送按钮点击事件
    $sendBtn.on('click', function() {
      const content = $messageInput.val().trim();
      if (!content) {
        showAlert('请填写短信内容！', 'warning');
        return;
      }

      // 禁用按钮，显示加载状态
      $sendBtn.prop('disabled', true);
      $btnText.text('发送中...');
      $btnSpinner.removeClass('d-none');
      // 隐藏之前的提示
      $resultAlert.addClass('d-none');
      $detailInfo.empty();

      // 发起 AJAX POST 请求（纯文本）
      $.ajax({
        url: '/sms/send',
        type: 'POST',
        contentType: 'text/plain',   // 与 Controller 的 @RequestBody String 匹配
        data: content,
        dataType: 'text',            // 期望返回纯文本
        success: function(response) {
          // response 例如 "短信发送成功: 13000000001"
          showAlert(response, 'success');
          // 展示更多详情
          $detailInfo.html(`<i class="bi bi-check-circle"></i> 已发送内容：<code>${escapeHtml(content)}</code>`);
          // 清空输入框（可选）
          // $messageInput.val('');
        },
        error: function(xhr, status, error) {
          let errMsg = '发送失败，请检查网络或服务端状态。';
          if (xhr.responseText) {
            errMsg = xhr.responseText;
          }
          showAlert(errMsg, 'danger');
        },
        complete: function() {
          // 恢复按钮
          $sendBtn.prop('disabled', false);
          $btnText.text('发送');
          $btnSpinner.addClass('d-none');
        }
      });
    });

    // 显示提示消息
    function showAlert(message, type) {
      $resultAlert.removeClass('d-none alert-success alert-warning alert-danger')
      .addClass(`alert-${type}`)
      .text(message);
    }

    // 简单防 XSS 转义（用于展示内容）
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  });
</script>

<!-- 可选：添加 Bootstrap Icons 美化 (非必须) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</body>
</html>
